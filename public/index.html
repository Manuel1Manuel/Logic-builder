function collectSelectionPins(list,kind){
 let ordered=sortByPosition(expandActionNodes(list).filter(n=>!n.hidden));
 let pins=[];
 for(let n of ordered){
  if(kind==="outputs"){
   // Chip-Eingänge sind ausschließlich Ziele und niemals Quellen.
   if(isChipInputNode(n))continue;
   if(n.outputs&&n.outputs.length){
    for(let i=0;i<n.outputs.length;i++)pins.push({node:n,index:i});
   }
  }else{
   // Chip-Ausgänge sind ausschließlich Quellen und niemals Ziele.
   if(isChipOutputNode(n))continue;
   if(n.inputs&&n.inputs.length){
    for(let i=0;i<n.inputs.length;i++){
     if(!wires.some(w=>w.to===n&&w.inputIndex===i))pins.push({node:n,index:i});
    }
   }
  }
 }
 return pins;
}

async function loadBlueprintString(str){
 const raw=String(str||"").trim();
 if(!raw){setBlueprintImportStatus("Fehler: Kein Blueprint eingefügt.",100,false);return false;}
 setBlueprintImportStatus(raw.length>250000?"Großer Blueprint wird geladen …":"Blueprint wird geprüft …",10,true);

 let bp;
 try{bp=JSON.parse(raw);}catch(e){setBlueprintImportStatus("Fehler: Ungültiges JSON.",100,false);return false;}
 setBlueprintImportStatus("JSON gelesen …",25,true);await new Promise(r=>setTimeout(r,0));
 if(!bp||!Array.isArray(bp.nodes)||!bp.nodes.length){setBlueprintImportStatus("Fehler: Blueprint enthält keine Nodes.",100,false);return false;}
 try{
  bp=expandBlueprint(bp);bp.name=String(bp.name||"").trim()||("Imported "+(blueprints.length+1));
  const validNodes=[];const total=bp.nodes.length;
  for(let i=0;i<total;i++){const n=bp.nodes[i];if(n&&n.type)validNodes.push(n);if(i%Math.max(1,Math.floor(total/20))===0){setBlueprintImportStatus("Nodes werden geprüft … "+Math.round(25+(i/total)*35)+"%",true);await new Promise(r=>setTimeout(r,0));}}
  if(!validNodes.length){setBlueprintImportStatus("Fehler: Keine gültigen Nodes gefunden.",100,false);return false;}
  bp.nodes=validNodes;setBlueprintImportStatus("Verbindungen werden geprüft …",65,true);await new Promise(r=>setTimeout(r,0));
  bp.wires=Array.isArray(bp.wires)?bp.wires.filter(w=>w&&w.from!==undefined&&w.to!==undefined).map(w=>({from:w.from,to:w.to,inputIndex:Number.isFinite(w.inputIndex)?w.inputIndex:0})):[]; 
  bp.chip=!!bp.chip;bp.mixedChipSelection=!!bp.mixedChipSelection;
  setBlueprintImportStatus("Blueprint wird gespeichert …",80,true);await new Promise(r=>setTimeout(r,0));
  bp=sanitizeBlueprintForStorage(bp);blueprints.push(bp);blueprintLibraryVersion++;blueprintScroll=Math.max(0,blueprints.length-blueprintVisibleRows);clampBlueprintScroll();
  setBlueprintImportStatus("✓ Blueprint erfolgreich importiert.",100,true);return true;
 }catch(e){setBlueprintImportStatus("Fehler beim Import: "+(e&&e.message?e.message:"unbekannter Fehler"),100,false);return false;}
}

function getInputIndexAtPoint(node,wx,wy){if(!node.inputs||!node.inputs.length)return-1;let best=-1,bestDist=PIN_HIT_RADIUS;for(let i=0;i<node.inputs.length;i++){let inp=node.inputs[i];let px=node.x+inp.x,py=node.y+inp.y;let d=Math.hypot(wx-px,wy-py);if(d<=bestDist){bestDist=d;best=i;}}return best;}
function getConnectTargetAtPoint(wx,wy){
 let best=null,bestDist=PIN_HIT_RADIUS;
 for(let i=nodes.length-1;i>=0;i--){
  let n=nodes[i];
  if(n.hidden)continue;
  if(n.chipPin){
   let p=n.inputs?.[0]||n.outputs?.[0]||{x:11,y:11};
   let d=Math.hypot(wx-(n.x+p.x),wy-(n.y+p.y));
   if(d<=bestDist){bestDist=d;best=n;}
   continue;
  }
  for(let j=0;j<(n.inputs||[]).length;j++){
   let p=n.inputs[j];
   let d=Math.hypot(wx-(n.x+p.x),wy-(n.y+p.y));
   if(d<=bestDist){bestDist=d;best=n;}
  }
  for(let j=0;j<(n.outputs||[]).length;j++){
   let p=n.outputs[j];
   let d=Math.hypot(wx-(n.x+p.x),wy-(n.y+p.y));
   if(d<=bestDist){bestDist=d;best=n;}
  }

}
function getPinHitAtPoint(wx,wy,target){if(target){if(target.chipPin){let p=target.inputs?.[0]||target.outputs?.[0]||{x:11,y:11};let px=target.x+p.x,py=target.y+p.y;if(Math.hypot(wx-px,wy-py)<=PIN_HIT_RADIUS)return{node:target,kind:target.chipPin==="in"?"input":"output",index:0};return null;}for(let i=0;i<(target.inputs||[]).length;i++){let inp=target.inputs[i];let px=target.x+inp.x,py=target.y+inp.y;if(Math.hypot(wx-px,wy-py)<=PIN_HIT_RADIUS)return{node:target,kind:"input",index:i};}for(let i=0;i<(target.outputs||[]).length;i++){let out=target.outputs[i];let px=target.x+out.x,py=target.y+out.y;if(Math.hypot(wx-px,wy-py)<=PIN_HIT_RADIUS)return{node:target,kind:"output",index:i};}return null;}for(let i=nodes.length-1;i>=0;i--){let n=nodes[i];if(n.hidden)continue;if(n.chipPin){let p=n.inputs?.[0]||n.outputs?.[0]||{x:11,y:11};let px=n.x+p.x,py=n.y+p.y;if(Math.hypot(wx-px,wy-py)<=PIN_HIT_RADIUS)return{node:n,kind:n.chipPin==="in"?"input":"output",index:0};continue;}for(let j=0;j<(n.inputs||[]).length;j++){let inp=n.inputs[j];let px=n.x+inp.x,py=n.y+inp.y;if(Math.hypot(wx-px,wy-py)<=PIN_HIT_RADIUS)return{node:n,kind:"input",index:j};}for(let j=0;j<(n.outputs||[]).length;j++){let out=n.outputs[j];let px=n.x+out.x,py=n.y+out.y;if(Math.hypot(wx-px,wy-py)<=PIN_HIT_RADIUS)return{node:n,kind:"output",index:j};}}return null;}
function connectSelectionToTarget(target,pinHit){let sources=expandActionNodes(selectedNodes).filter(n=>n!==target&&!n.hidden);for(let src of sources){let idx=pinHit&&pinHit.node===target&&pinHit.kind==="input"?pinHit.index:(target.chipPin?0:(target.type==="switch"||target.type==="output"||target.type==="not"?0:getFreeSlot(target)));if(idx===-1)continue;wires.push({from:src,to:target,inputIndex:idx});}}
function connectSourceToSelection(source){let targets=expandActionNodes(selectedNodes).filter(n=>n!==source&&!n.hidden);for(let target of targets){let idx=target.chipPin?0:(target.type==="switch"||target.type==="output"||target.type==="not"?0:getFreeSlot(target));if(idx===-1)continue;wires.push({from:source,to:target,inputIndex:idx});}}
function tryConnectFrom(src,wx,wy){if(!src||src.chipPin==="in")return;let target=getConnectTargetAtPoint(wx,wy);if(!target||target===src)return;if(target.chipPin==="out")return;if(src.outputs&&target.inputs){if(target.type==="output"){wires.push({from:src,to:target,inputIndex:0});return;}if(target.type==="not"){wires.push({from:src,to:target,inputIndex:0});return;}let idx=target.chipPin?0:getInputIndexAtPoint(target,wx,wy);if(idx===-1)idx=target.type==="switch"?0:getFreeSlot(target);if(idx!==-1||target.type==="switch"){if(target.type==="switch"){wires.push({from:src,to:target,inputIndex:0});}else{wires.push({from:src,to:target,inputIndex:idx});}}}}

function pointInSelection(x,y){if(!selectionBox)return false;return x>=selectionBox.x&&x<=selectionBox.x+selectionBox.w&&y>=selectionBox.y&&y<=selectionBox.y+selectionBox.h;}
function getChipNodesById(id){return nodes.filter(n=>n.chipId===id);}
function getChipShellRect(id){let chipNodes=getChipNodesById(id);let shellNode=chipNodes.find(n=>n.chipShell&&Number.isFinite(n.chipShell.x)&&Number.isFinite(n.chipShell.y)&&Number.isFinite(n.chipShell.w)&&Number.isFinite(n.chipShell.h));if(shellNode)return shellNode.chipShell;let rects=chipNodes.map(n=>getNodeRect(n)).filter(r=>Number.isFinite(r.x)&&Number.isFinite(r.y)&&Number.isFinite(r.w)&&Number.isFinite(r.h));if(!rects.length)return null;let minX=Math.min(...rects.map(r=>r.x));let minY=Math.min(...rects.map(r=>r.y));let maxX=Math.max(...rects.map(r=>r.x+r.w));let maxY=Math.max(...rects.map(r=>r.y+r.h));return{x:minX-14,y:minY-14,w:(maxX-minX)+28,h:(maxY-minY)+28};}
function isChipSelected(id){return selectedNodes.some(n=>n.chipId===id);}
function getChipIdAtPoint(x,y){for(let i=nodes.length-1;i>=0;i--){let n=nodes[i];if(!n.chipId)continue;let shell=getChipShellRect(n.chipId);if(shell&&x>=shell.x&&x<=shell.x+shell.w&&y>=shell.y&&y<=shell.y+shell.h)return n.chipId;}return null;}
function moveChip(id,dx,dy){if(!Number.isFinite(dx)||!Number.isFinite(dy)||!id)return;let chipNodes=getChipNodesById(id);if(!chipNodes.length)return;let shellNode=chipNodes.find(n=>n.chipShell&&Number.isFinite(n.chipShell.x)&&Number.isFinite(n.chipShell.y));if(shellNode&&shellNode.chipShell){shellNode.chipShell.x+=dx;shellNode.chipShell.y+=dy;}for(let n of chipNodes){if(Number.isFinite(n.x)&&Number.isFinite(n.y)){n.x+=dx;n.y+=dy;}}}function removeNodes(list){let targets=expandActionNodes(list);let set=new Set(targets);for(let i=wires.length-1;i>=0;i--){if(set.has(wires[i].from)||set.has(wires[i].to))wires.splice(i,1);}for(let i=nodes.length-1;i>=0;i--){if(set.has(nodes[i]))nodes.splice(i,1);}pruneSelectionState();}
function renderVisibilityMenu(){menuList.innerHTML="";const items=[{key:"switch",label:"SWITCH"},{key:"lamp",label:"LAMP"},{key:"not",label:"NOT"},{key:"or3",label:"OR3"},{key:"and",label:"AND"},{key:"or",label:"OR"},{key:"xor",label:"XOR"},{key:"output",label:"OUTPUT"},{key:"timer",label:"TIMER"},{key:"key",label:"KEY"},{key:"clock",label:"CLOCK"},{key:"memory",label:"MEM"},{key:"led",label:"LED"}];for(let item of items){let label=document.createElement("label");let cb=document.createElement("input");cb.type="checkbox";cb.checked=nodeVisibility[item.key]!==false;cb.onchange=()=>{nodeVisibility[item.key]=cb.checked;};let span=document.createElement("span");span.textContent=item.label;label.appendChild(cb);label.appendChild(span);menuList.appendChild(label);}let wireLabel=document.createElement("label");let wireCb=document.createElement("input");wireCb.type="checkbox";wireCb.checked=wiresVisible;wireCb.onchange=()=>{wiresVisible=wireCb.checked;};let wireSpan=document.createElement("span");wireSpan.textContent="WIREN";wireLabel.appendChild(wireCb);wireLabel.appendChild(wireSpan);menuList.appendChild(wireLabel);let simpleLabel=document.createElement("label");let simpleCb=document.createElement("input");simpleCb.type="checkbox";simpleCb.checked=simpleGraphics;simpleCb.onchange=()=>{simpleGraphics=simpleCb.checked;updateUiTheme();};let simpleSpan=document.createElement("span");simpleSpan.textContent="SIMPLE GRAFIK";simpleLabel.appendChild(simpleCb);simpleLabel.appendChild(simpleSpan);menuList.appendChild(simpleLabel);}

function handleCanvasMouseMove(e){
 mouseScreen.x=e.clientX;
 mouseScreen.y=e.clientY;
 if(blueprintScrollDrag)setBlueprintScrollFromY(e.clientY);
 if(rightRenameCandidate&&Math.hypot(e.clientX-rightRenameCandidate.startX,e.clientY-rightRenameCandidate.startY)>8)rightRenameCandidate.moved=true;
 if(timerMenuCandidate&&Math.hypot(e.clientX-timerMenuCandidate.startX,e.clientY-timerMenuCandidate.startY)>8)timerMenuCandidate.moved=true;
 if(keyMenuCandidate&&Math.hypot(e.clientX-keyMenuCandidate.startX,e.clientY-keyMenuCandidate.startY)>8)keyMenuCandidate.moved=true;
 if(clockMenuCandidate&&Math.hypot(e.clientX-clockMenuCandidate.startX,e.clientY-clockMenuCandidate.startY)>8)clockMenuCandidate.moved=true;
 if(panning){offsetX+=e.movementX;offsetY+=e.movementY;}
 updateMouseWorld();
 if(chipDrag){let dx=mouseWorld.x-chipDrag.lastX;let dy=mouseWorld.y-chipDrag.lastY;if(Number.isFinite(dx)&&Number.isFinite(dy)&&(dx||dy))moveChip(chipDrag.id,dx,dy);chipDrag.lastX=mouseWorld.x;chipDrag.lastY=mouseWorld.y;}
 if(groupDragging&&selectionActive&&selectionBox){let dx=e.movementX/zoom;let dy=e.movementY/zoom;let movedChipIds=new Set();for(let n of expandActionNodes(selectedNodes)){if(n.chipId){if(!movedChipIds.has(n.chipId)){movedChipIds.add(n.chipId);moveChip(n.chipId,dx,dy);}}else{n.x+=dx;n.y+=dy;}}selectionBox.x+=dx;selectionBox.y+=dy;}
 if(selecting){selectionEnd.x=mouseWorld.x;selectionEnd.y=mouseWorld.y;}
 if(drag){drag.x=mouseWorld.x-drag.dragOffsetX;drag.y=mouseWorld.y-drag.dragOffsetY;}
}

function handleCanvasMouseDown(e){
 mouseScreen.x=e.clientX;
 mouseScreen.y=e.clientY;
 updateMouseWorld();
 if(e.button===0&&selectionActive&&selectionWireMode){
  let target=getConnectTargetAtPoint(mouseWorld.x,mouseWorld.y);
  if(target){
   let pinHit=getPinHitAtPoint(mouseWorld.x,mouseWorld.y,target);
   if(selectionWireMode==="from")connectSelectionToTarget(target,pinHit);
   else if(selectionWireMode==="to")connectSourceToSelection(target);
  }
  selectionWireMode=null;
  return;
 }
 let additiveSelect=e.ctrlKey||e.metaKey||pressedKeys.has("KeyQ");
 if(!additiveSelect&&!selectionWireMode){
  let inside=selectionActive&&selectionBox&&pointInSelection(mouseWorld.x,mouseWorld.y);
  if(!inside&&(selectionActive||batchConnect))cancelSelectionContext();
 }
 if(isInLibraryPanel(e.clientX,e.clientY)){
  let thumb=getLibraryScrollThumbRect();
  let track=getLibraryScrollTrackRect();
  let idx=getLibraryItemIndexAt(e.clientX,e.clientY);
  if(thumb&&e.clientX>=thumb.x&&e.clientX<=thumb.x+thumb.w&&e.clientY>=thumb.y&&e.clientY<=thumb.y+thumb.h){
   if(e.button===0){blueprintScrollDrag=true;blueprintScrollDragOffset=e.clientY-thumb.y;return;}
  }
  if(track&&e.clientX>=track.x&&e.clientX<=track.x+track.w&&e.clientY>=track.y&&e.clientY<=track.y+track.h&&e.button===0){
   blueprintScrollDrag=true;
   blueprintScrollDragOffset=Math.max(0,thumb?thumb.h/2:10);
   setBlueprintScrollFromY(e.clientY);
   return;
  }
  if(idx!==-1){
   if(e.button===2){openBlueprintActionPopup(idx);return;}
   libraryDrag={bp:cloneBlueprint(blueprints[idx])};
   return;
  }
 }
 panning=false;
 groupDragging=false;
 if(blueprint&&e.button===0){
  placeBlueprint(blueprint,mouseWorld.x,mouseWorld.y);
  blueprint=null;
  return;
 }
 if(selectionActive&&e.button===0&&pointInSelection(mouseWorld.x,mouseWorld.y)){
  groupDragging=true;
  return;
 }
 if(e.button===0){
  let cid=getChipIdAtPoint(mouseWorld.x,mouseWorld.y);
  if(cid){
   drag=null;
   connectFrom=null;
   selecting=false;
   groupDragging=false;
   selectionWireMode=null;
   blueprintScrollDrag=false;
   chipDrag={id:cid,lastX:mouseWorld.x,lastY:mouseWorld.y};
   return;
  }
 }
 let hot=getHotbarItemAt(e.clientX,e.clientY);
 if(hot&&e.button===0){
  let n=new Node(mouseWorld.x,mouseWorld.y,hot.type);
  let ns=getNodeSize(n);
  n.x=mouseWorld.x-ns.w/2;
  n.y=mouseWorld.y-ns.h/2;
  nodes.push(n);
  drag=n;
  drag.dragOffsetX=ns.w/2;
  drag.dragOffsetY=ns.h/2;
  return;
 }
 if(e.button===0){
  for(let i=nodes.length-1;i>=0;i--){
   let n=nodes[i];
   if(n.contains(mouseWorld.x,mouseWorld.y)){
    if(n.type==="switch"&&!n.chipId)n.state=!n.state;
    drag=n;
    drag.dragOffsetX=mouseWorld.x-n.x;
    drag.dragOffsetY=mouseWorld.y-n.y;
    return;
   }
  }
 }
 if(additiveSelect&&e.button===0){
  selecting=true;
  selectionStart={x:mouseWorld.x,y:mouseWorld.y};
  selectionEnd={x:mouseWorld.x,y:mouseWorld.y};
  return;
 }
 if(e.button===2){
  for(let i=nodes.length-1;i>=0;i--){
   let n=nodes[i];
   if(!n.contains(mouseWorld.x,mouseWorld.y))continue;
   if(n.type==="timer"){
    connectFrom=n;
    timerMenuCandidate={node:n,startX:e.clientX,startY:e.clientY,startTime:performance.now(),moved:false};
    return;
   }
   if(n.type==="key"){
    connectFrom=n;
    keyMenuCandidate={node:n,startX:e.clientX,startY:e.clientY,startTime:performance.now(),moved:false};
    return;
   }
   if(n.type==="clock"){
    connectFrom=n;
    clockMenuCandidate={node:n,startX:e.clientX,startY:e.clientY,startTime:performance.now(),moved:false};
    return;
   }
   if(n.chipPin==="in"){connectFrom=null;return;}
   connectFrom=n;
   if(!n.chipId&&(n.type==="switch"||n.type==="output")){
    rightRenameCandidate={ node:n, startX:e.clientX, startY:e.clientY, startTime:performance.now(), moved:false };
   }
   return;
  }
 }
 panning=true;
}

function handleCanvasMouseUp(e){
 mouseScreen.x=e.clientX;
 mouseScreen.y=e.clientY;
 updateMouseWorld();
 panning=false;
 if(blueprintScrollDrag){blueprintScrollDrag=false;return;}

 if(timerMenuCandidate){
  let d=performance.now()-timerMenuCandidate.startTime;
  if(d<300&&!timerMenuCandidate.moved){
   timerMenuNode=timerMenuCandidate.node;
   document.getElementById("timerDelay").value=timerMenuNode.delay;
   document.getElementById("timerStay").checked=timerMenuNode.stay;
   document.getElementById("timerMenu").style.display="flex";
   timerMenuCandidate=null;
   connectFrom=null;
   return;
  }
  tryConnectFrom(timerMenuCandidate.node,mouseWorld.x,mouseWorld.y);
  timerMenuCandidate=null;
  connectFrom=null;
  return;
 }

 if(keyMenuCandidate){
  let d=performance.now()-keyMenuCandidate.startTime;
  if(d<300&&!keyMenuCandidate.moved){
   openKeyPopup(keyMenuCandidate.node);
   keyMenuCandidate=null;
   connectFrom=null;
   return;
  }
  tryConnectFrom(keyMenuCandidate.node,mouseWorld.x,mouseWorld.y);
  keyMenuCandidate=null;
  connectFrom=null;
  return;
 }

 if(clockMenuCandidate){
  let d=performance.now()-clockMenuCandidate.startTime;
  if(d<300&&!clockMenuCandidate.moved){
   openClockPopup(clockMenuCandidate.node);
   clockMenuCandidate=null;
   connectFrom=null;
   return;
  }
  tryConnectFrom(clockMenuCandidate.node,mouseWorld.x,mouseWorld.y);
  clockMenuCandidate=null;
  connectFrom=null;
  return;
 }

 if(chipDrag&&e.button===0){chipDrag=null;drag=null;connectFrom=null;if(typeof sendLogicState==="function")sendLogicState();return;}

 if(libraryDrag){
  if(!isInLibraryPanel(e.clientX,e.clientY)&&e.clientY<h-90){let px=mouseWorld.x,py=mouseWorld.y;placeBlueprint(libraryDrag.bp,px,py);focusOnBlueprint(libraryDrag.bp,px,py);}
  libraryDrag=null;
  return;
 }

 if(drag&&e.button===0){
  drag=null;
  // Änderungen (z.B. Switch AN/AUS) sofort übertragen, ohne auf den nächsten Poll zu warten.
  if(typeof sendLogicState==="function") sendLogicState();
}

 if(selecting){
  selecting=false;
  let minX=Math.min(selectionStart.x,selectionEnd.x);
  let minY=Math.min(selectionStart.y,selectionEnd.y);
  let maxX=Math.max(selectionStart.x,selectionEnd.x);
  let maxY=Math.max(selectionStart.y,selectionEnd.y);
  let boxNodes=nodes.filter(n=>{
   if(n.hidden)return false;
   let r=getNodeRect(n);
   return r.x>=minX&&r.y>=minY&&r.x+r.w<=maxX&&r.y+r.h<=maxY;
  });
  selectedNodes=boxNodes;
  if(batchConnect&&batchConnect.phase==="target"){
   batchConnect.targetNodes=collectConnectionTargets(selectedNodes);
   batchConnect.targetBox=getSelectionBounds(batchConnect.targetNodes);
   selectionActive=!!batchConnect.targetNodes.length;
   selectionBox=batchConnect.targetBox;
   return;
  }
  if(selectedNodes.length){
   selectionBox=getSelectionBounds(selectedNodes);
   selectionActive=true;
   qSelectedNodes=selectedNodes.slice();
  }else{
   clearSelection();
  }
  return;
 }

 groupDragging=false;
 if(typeof sendLogicState==="function")sendLogicState();

 if(e.button===2){
  if(rightRenameCandidate){
   let releasedNode=null;
   for(let i=nodes.length-1;i>=0;i--){
    if(nodes[i].contains(mouseWorld.x,mouseWorld.y)){
     releasedNode=nodes[i];
     break;
    }
   }
   if(rightRenameCandidate.node===releasedNode&&!rightRenameCandidate.moved&&!timerMenuCandidate&&performance.now()-rightRenameCandidate.startTime<300){
    openNamePopup(rightRenameCandidate.node);
    connectFrom=null;
    rightRenameCandidate=null;
    return;
   }
  }
  if(connectFrom){
   tryConnectFrom(connectFrom,mouseWorld.x,mouseWorld.y);
  }
  connectFrom=null;
  rightRenameCandidate=null;
  timerMenuCandidate=null;
  keyMenuCandidate=null;
  clockMenuCandidate=null;
 }
}

function focusOnBlueprint(bp,x,y){let f=bp&&bp.focus;if(!f)return;let z=Math.min((w-80)/f.w,(h-200)/f.h);zoom=Math.max(minZoom,Math.min(1,z));offsetX=(w-f.w*zoom)/2-(x+f.x)*zoom;offsetY=((h-84)-f.h*zoom)/2-(y+f.y)*zoom;updateMouseWorld();}
canvas.addEventListener("mousemove",handleCanvasMouseMove);
canvas.addEventListener("mousedown",()=>{let a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();});

canvas.addEventListener("touchstart",e=>{
 if(mode==="ipad"&&e.touches.length===2){
  let t0=e.touches[0],t1=e.touches[1];
  pinchActive=true;
  pinchStartDist=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY)||1;
  pinchStartZoom=zoom;
  let midX=(t0.clientX+t1.clientX)/2,midY=(t0.clientY+t1.clientY)/2;
  pinchWorldMidX=screenToWorldX(midX);
  pinchWorldMidY=screenToWorldY(midY);
  activeTouchId=null;
  drag=null;
  connectFrom=null;
  selecting=false;
  groupDragging=false;
  panning=false;
  chipDrag=null;
  libraryDrag=null;
  timerMenuCandidate=null;
  keyMenuCandidate=null;
  clockMenuCandidate=null;
  rightRenameCandidate=null;
  e.preventDefault();
  return;
 }
 if(activeTouchId!==null)return;
 let t=e.changedTouches[0];
 if(!t)return;
 activeTouchId=t.identifier;
 activeTouchButton=touchMode==="left"?0:2;
 lastTouchX=t.clientX;
 lastTouchY=t.clientY;
 handleCanvasMouseDown({clientX:t.clientX,clientY:t.clientY,button:activeTouchButton,movementX:0,movementY:0,ctrlKey:false});
 e.preventDefault();
},{passive:false});

canvas.addEventListener("touchmove",e=>{
 if(mode==="ipad"&&pinchActive&&e.touches.length>=2){
  let t0=e.touches[0],t1=e.touches[1];
  let dist=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY)||1;
  let newZoom=Math.max(minZoom,Math.min(maxZoom,pinchStartZoom*(dist/pinchStartDist)));
  let midX=(t0.clientX+t1.clientX)/2,midY=(t0.clientY+t1.clientY)/2;
  zoom=newZoom;
  offsetX=midX-pinchWorldMidX*zoom;
  offsetY=midY-pinchWorldMidY*zoom;
  updateMouseWorld();
  e.preventDefault();
  return;
 }
 if(activeTouchId===null)return;
 let t=null;
 for(let i=0;i<e.changedTouches.length;i++){
  if(e.changedTouches[i].identifier===activeTouchId){
   t=e.changedTouches[i];
   break;
  }
 }
 if(!t)return;
 let dx=t.clientX-lastTouchX,dy=t.clientY-lastTouchY;
 lastTouchX=t.clientX;
 lastTouchY=t.clientY;
 handleCanvasMouseMove({clientX:t.clientX,clientY:t.clientY,button:activeTouchButton,movementX:dx,movementY:dy,ctrlKey:false});
 e.preventDefault();
},{passive:false});

canvas.addEventListener("touchend",e=>{
 if(mode==="ipad"&&pinchActive){
  if(e.touches.length<2)pinchActive=false;
  if(e.touches.length===1){
   let t=e.touches[0];
   activeTouchId=t.identifier;
   lastTouchX=t.clientX;
   lastTouchY=t.clientY;
  }
  e.preventDefault();

function getFreeSlot(node){
 if(node.type==="switch")return 0;
 if(node.type==="not")return 0;
 let used=new Set(wires.filter(w=>w.to===node).map(w=>w.inputIndex));
 for(let i=0;i<node.inputs.length;i++)if(!used.has(i))return i;
 return -1;
}

function collectConnectionSources(list){
 return sortByPosition(expandActionNodes(list).filter(n=>!n.hidden&&n.chipPin!=="in")).filter(n=>((n.outputs&&n.outputs.length)||n.chipPin==="out"));
}

function collectConnectionTargets(list){
 return sortByPosition(expandActionNodes(list).filter(n=>!n.hidden&&n.chipPin!=="out")).filter(n=>((n.inputs&&n.inputs.length)||n.chipPin==="in"));
}

function connectSelectionsPairwise(sourceNodes,targetNodes){
 let outs=collectSelectionPins(sourceNodes,"outputs");
 let ins=collectSelectionPins(targetNodes,"inputs");
 let count=Math.min(outs.length,ins.length);
 for(let i=0;i<count;i++){
  let from=outs[i].node,to=ins[i].node;
  if(!isValidWireEndpoints(from,to))continue;
  wires.push({from,to,inputIndex:ins[i].index});
 }
}
function getOrderedInputSlots(node){
 if(isChipOutputNode(node))return[];
 if(isChipInputNode(node))return[0];
 let used=new Set(wires.filter(w=>w.to===node).map(w=>w.inputIndex));
 if(node&&node.inputs&&node.inputs.length){
  let slots=[];
  for(let i=0;i<node.inputs.length;i++)if(!used.has(i))slots.push(i);
  if(slots.length)return slots;
 }
 if(node&&(node.type==="switch"||node.type==="output"||node.type==="not"))return[0];
 return[];
}
function connectSelectionsChunked(sourceNodes,targetNodes){
 let outs=collectSelectionPins(sourceNodes,"outputs");
 let targets=sortByPosition(expandActionNodes(targetNodes).filter(n=>!n.hidden&&!isChipOutputNode(n)));
 let o=0;
 for(let target of targets){
  let slots=getOrderedInputSlots(target);
  for(let slot of slots){
   if(o>=outs.length)return;
   let from=outs[o].node;
   if(isValidWireEndpoints(from,target)){
    wires.push({from,to:target,inputIndex:slot});
    o++;
   }
  }
 }}
function connectSelectionsFirstFree(sourceNodes,targetNodes){
 let outs=collectSelectionPins(sourceNodes,"outputs");
 let targets=sortByPosition(expandActionNodes(targetNodes).filter(n=>!n.hidden&&!isChipOutputNode(n)));
 let count=Math.min(outs.length,targets.length);
 for(let i=0;i<count;i++){
  let target=targets[i];
  let slots=getOrderedInputSlots(target);
  if(!slots.length)continue;
  let from=outs[i].node;
  if(!isValidWireEndpoints(from,target))continue;
  wires.push({from,to:target,inputIndex:slots[0]});
 }
}
function startBatchConnect(mode="chunked"){
 if(!selectionActive||!selectedNodes.length)return;
 let sourceNodes=collectConnectionSources(selectedNodes);
 if(!sourceNodes.length)return;
 batchConnect={sourceNodes:sortByPosition(sourceNodes),triggerNodes:sortByPosition(sourceNodes),sourceBox:getSelectionBounds(sourceNodes),targetNodes:[],targetBox:null,phase:"target",connectMode:mode};
 clearSelection();
}
function finalizeBatchConnect(){
 if(!batchConnect)return;
 let targets=batchConnect.targetNodes.length?batchConnect.targetNodes:collectConnectionTargets(selectedNodes);
 if(!targets.length)return;
 // K füllt die freien Eingänge auf. L verbindet parallel 1:1 und füllt keine weiteren Eingänge.
 if(batchConnect.connectMode==="chunked")connectSelectionsChunked(batchConnect.sourceNodes,targets);
 else connectSelectionsPairwise(batchConnect.sourceNodes,targets);
 let triggerNodes=batchConnect.triggerNodes||batchConnect.sourceNodes;
 batchConnect=null;
 clearSelection();
 restoreTriggerSelection(triggerNodes);
}
function runQuickConnect(mode){
 if(!selectionActive||!selectedNodes.length)return false;
 let sourceNodes=collectConnectionSources(selectedNodes);
 let targetNodes=collectConnectionTargets(selectedNodes);
 if(!sourceNodes.length||!targetNodes.length)return false;
 // K = auffüllen, L = parallel 1:1.
 if(mode==="chunked")connectSelectionsChunked(sourceNodes,targetNodes);
 else connectSelectionsPairwise(sourceNodes,targetNodes);
 restoreTriggerSelection(sourceNodes);
 return true;
}

addEventListener("keydown",e=>{
 if(document.activeElement&&["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;
 pressedKeys.add(e.code);
 if(e.code==="Space")e.preventDefault();

 if(e.key==="ö"||e.key==="Ö"||e.code==="Semicolon"){
  resetAllClocks();
  e.preventDefault();
  return;
 }

 if(e.key==="Escape"){
  if(selectionActive||batchConnect){
   cancelSelectionContext();
   e.preventDefault();
   return;
  }
 }


 if((e.code==="Digit1"||e.code==="Numpad1")&&pressedKeys.has("KeyQ")){
  if(selectAllForQuickBlueprint()) e.preventDefault();
  return;
 }

 if(e.code==="KeyQ"&&pressedKeys.has("Digit1")){
  if(selectAllForQuickBlueprint()) e.preventDefault();
  return;
 }

 if(e.key.toLowerCase()==="f"){
  if(copyQuickBlueprintSelection()) e.preventDefault();
  return;
 }

 if(e.key.toLowerCase()==="a"){
  if(selectionActive&&selectedNodes.length){
   arrangeSelection();
   e.preventDefault();
  }
  return;
 }

 if(e.key.toLowerCase()==="i"){
  if(batchConnect&&batchConnect.phase==="target"){
   e.preventDefault();
   return;
  }
  if(selectionActive&&selectedNodes.length){
   startBatchConnect("chunked");
   e.preventDefault();
  }
  return;
 }

 if(e.key.toLowerCase()==="k"){
  if(batchConnect&&batchConnect.phase==="target"){
   batchConnect.connectMode="chunked";
   if(batchConnect.targetNodes.length){
    finalizeBatchConnect();
   }
   e.preventDefault();
   return;
  }
  if(runQuickConnect("chunked")){
   e.preventDefault();
   return;
  }
  if(selectionActive&&selectedNodes.length){
   startBatchConnect("chunked");
   e.preventDefault();
  }
  return;
 }

 if(e.key.toLowerCase()==="l"){
  if(batchConnect&&batchConnect.phase==="target"){
   batchConnect.connectMode="parallel";
   if(batchConnect.targetNodes.length){
    finalizeBatchConnect();
   }
   e.preventDefault();
   return;
  }
  if(runQuickConnect("parallel")){
   e.preventDefault();
   return;
  }
  if(selectionActive&&selectedNodes.length){
   startBatchConnect("parallel");
   e.preventDefault();
  }
  return;
 }

 if(e.key.toLowerCase()==="w"){
  if(selectionActive&&selectedNodes.length){
   selectionWireMode="from";
   e.preventDefault();
  }
 }

 if(e.key.toLowerCase()==="s"){
  if(selectionActive&&selectedNodes.length){
   selectionWireMode="to";
   e.preventDefault();
  }
 }

 if(keyMenuNode&&document.getElementById("keyPopup").style.display==="flex"){
  if(!["ShiftLeft","ShiftRight","ControlLeft","ControlRight","AltLeft","AltRight","MetaLeft","MetaRight"].includes(e.code)){
   keyMenuNode.assignedKey=e.code;
   document.getElementById("keyPopupText").textContent="Key: "+prettyKey(e.code);
   document.getElementById("keyPopup").style.display="none";
   keyMenuNode=null;
   keyMenuCandidate=null;
  }
 }

 if(e.key==="Delete"||e.key==="Backspace"){
  if(selectionActive){
   deleteSelection();
   // Löschung sofort an den Server schicken. Der Server speichert zuerst
   // und verteilt danach den bestätigten Zustand an alle Clients.
   if(typeof sendLogicState==="function") sendLogicState();
   e.preventDefault();
  }
 }

 if(e.key.toLowerCase()==="c"){
  if(selectionActive&&selectedNodes.length){
   blueprint=buildBlueprintFromSelection();
   e.preventDefault();
  }
 }

 if(e.key.toLowerCase()==="b"){
  e.preventDefault();
  saveBlueprintToLibrary();
 }
});

function evaluate(){
 for(let n of nodes){
  for(let i of n.inputs)i.value=false;
 }
 let maxPasses=Math.max(1,nodes.length+5);
 for(let pass=0;pass<maxPasses;pass++){
  for(let n of nodes){
   let len=n.inputs.length;
   let a=n._nx;
   if(!a||a.length!==len)a=n._nx=new Array(len);
   for(let i=0;i<len;i++)a[i]=false;
  }
  for(let w of wires){
   if(!w||!w.from||!w.to)continue;
   if(!w.from.output)continue;
   let a=w.to._nx;
   if(!a)continue;
   if(w.inputIndex>=0&&w.inputIndex<a.length)a[w.inputIndex]=true;
  }
  let changed=false;
  for(let n of nodes){
   let a=n._nx,ins=n.inputs;
   for(let i=0;i<a.length;i++){
    if(ins[i].value!==a[i]){ins[i].value=a[i];changed=true;}
   }
  }
  for(let n of nodes)n.update();
  if(!changed)break;
 }
}

const logicSocket = io();
let applyingRemoteLogicState = false;
let logicSyncReady = false;
let lastLogicSnapshot = "";
let pendingLogicSnapshot = "";
let logicServerRevision = 0;
let lastBlueprintSerializedVersion = -1;
let lastBlueprintSyncData = [];
let lastBlueprintSentVersion = -1;
let lastDisplayedStorageBytes = 0;

function formatStorageSize(bytes){
  if(bytes >= 1024*1024) return (bytes/(1024*1024)).toFixed(2)+" MB";
  if(bytes >= 1024) return (bytes/1024).toFixed(2)+" KB";
  return Math.round(bytes)+" B";
}

function updateStorageDisplay(){
  const el=document.getElementById("memoryUsage");
  if(!el) return;
  let blueprintBytes=0;
  if(lastBlueprintSerializedVersion !== blueprintLibraryVersion){
    const data=getBlueprintSyncData();
    blueprintBytes=new Blob([JSON.stringify(data)]).size;
  }else{
    blueprintBytes=new Blob([JSON.stringify(lastBlueprintSyncData)]).size;
  }
  const stateBytes=new Blob([lastLogicSnapshot||serializeLogicState()]).size;
  lastDisplayedStorageBytes=stateBytes+blueprintBytes;
  el.textContent="Speicher: "+formatStorageSize(lastDisplayedStorageBytes)+" · "+(lastDisplayedStorageBytes*8).toLocaleString("de-DE")+" bit";
}

function getBlueprintSyncData(){
  if(lastBlueprintSerializedVersion !== blueprintLibraryVersion){
    // Nur bei einer echten Änderung wird die komplette Bibliothek kopiert.
    // Das verhindert, dass ein großer Blueprint alle 50 ms erneut dupliziert wird.
    lastBlueprintSyncData = blueprints.map(bp => sanitizeBlueprintForStorage(bp));
    lastBlueprintSerializedVersion = blueprintLibraryVersion;
  }
  return lastBlueprintSyncData;
}

function getLogicSyncId(n){
  if(!n.__logicSyncId){
    n.__logicSyncId = "node_" + Math.random().toString(36).slice(2) + "_" + Date.now().toString(36);
  }
  return n.__logicSyncId;
}

function serializeLogicState(){
  const nodeIds = new Map();
  for(const n of nodes) nodeIds.set(n,getLogicSyncId(n));
  const snapshotNodes = nodes.map(n => {
    const d = {
      id:getLogicSyncId(n),
      x:Number(n.x)||0,
      y:Number(n.y)||0,
      relX:Number(n.x)||0,
      relY:Number(n.y)||0,
      type:n.type || "switch",
      state:getSavedNodeState(n),
      delay:Number(n.delay)||0,
      stay:!!n.stay,
      name:n.name || "",
      chipId:n.chipId || null,
      chipName:n.chipName || "",
      chipPin:n.chipPin || "",
      chipShell:n.chipShell || null,
      hidden:!!n.hidden,
      assignedKey:n.assignedKey || "",
      interval:Number(n.interval)||1000,
      memoryState:!!n.memoryState,
      timerRunning:!!n.timerRunning,
      offTimerRunning:!!n.offTimerRunning,
      timerStart:Number(n.timerStart)||0,
      offTimerStart:Number(n.offTimerStart)||0,
      clockState:n.clockState !== false,
      clockLastToggle:Number(n.clockLastToggle)||0
    };
    if(n.type === "switch") d.state = !!(n.state || n.output);
    return d;
  });

  return JSON.stringify({
    version:4,
    name:"Logic Builder",
    chip:false,
    mixedChipSelection:false,
    nodes:snapshotNodes,
    wires:wires.map(w => ({
      from:nodeIds.get(w.from),
      to:nodeIds.get(w.to),
      inputIndex:Number.isFinite(w.inputIndex) ? w.inputIndex : 0
    })).filter(w => w.from && w.to),
  });
}
function applyLogicState(state){
  if(!state || !Array.isArray(state.nodes) || !Array.isArray(state.wires)) return false;

  // Während der eigenen Mausbewegung niemals die Position oder Einstellungen zurücksetzen.
  if(drag || groupDragging || chipDrag || libraryDrag || selecting) return false;

  applyingRemoteLogicState = true;
  try{
    const oldNodes = nodes.slice();
    const oldById = new Map(oldNodes.map(n => [n.__logicSyncId, n]));
    const newNodes = [];

    for(let i=0;i<state.nodes.length;i++){
      const d = state.nodes[i];
      const type = d.type || "switch";
      let n = d.id ? oldById.get(d.id) : oldNodes[i];

      if(!n || n.type !== type){
        n = new Node(Number(d.x)||0, Number(d.y)||0, type);
      }

      n.__logicSyncId = d.id || n.__logicSyncId || getLogicSyncId(n);
      n.x = Number(d.x)||0;
      n.y = Number(d.y)||0;
      n.chipId = d.chipId || null;
      n.chipPin = d.chipPin || null;
      n.chipShell = d.chipShell || null;

      if(type === "key"){
        n.assignedKey = d.assignedKey || "";
      }
      if(type === "switch" || type === "output"){
        n.name = d.name || "";
        if(type === "switch" && Object.prototype.hasOwnProperty.call(d, "state")) n.state = !!d.state;
      }
      if(type === "timer"){
        n.delay = Number(d.delay)||0;
        n.stay = !!d.stay;
      }
      if(type === "clock"){
        n.interval = Number(d.interval)||1000;
      }

      newNodes.push(n);
    }

    nodes.length = 0;
    nodes.push(...newNodes);

    wires.length = 0;
    const nodesBySyncId = new Map(nodes.map(n => [n.__logicSyncId, n]));
    for(const w of state.wires){
      const from = nodesBySyncId.get(w.from) || (Number.isInteger(w.from) ? nodes[w.from] : null);
      const to = nodesBySyncId.get(w.to) || (Number.isInteger(w.to) ? nodes[w.to] : null);
      if(from && to && from.chipPin!=="in" && to.chipPin!=="out"){
        wires.push({
          from,
          to,
          inputIndex:Number.isFinite(w.inputIndex) ? w.inputIndex : 0
        });
      }
    }

    return true;
  }finally{
    applyingRemoteLogicState = false;
  }
}


function setServerStatus(text){
  const el=document.getElementById("serverStatus");
  if(el) el.textContent="Server: "+text;
}
function setServerEqualStatus(){
  setServerStatus("Server = Client · gleicher Stand (Version "+logicServerRevision+")");
}
function sendStateChange(payload){
  setServerStatus("Server ≠ Client · deine Änderung wird gespeichert ...");
  logicSocket.emit("stateChange", payload);
}
function sendLogicState(){
  if(!logicSyncReady || applyingRemoteLogicState) return;
  const snapshot = serializeLogicState();
  if(snapshot === lastLogicSnapshot) {
    setServerEqualStatus();
    return;
  }
  if(snapshot === pendingLogicSnapshot) return;

  pendingLogicSnapshot = snapshot;
  const payload = JSON.parse(snapshot);
  payload.baseRevision = logicServerRevision;
  sendStateChange(payload);
}

function applyBlueprintLibraryState(list){
  if(!Array.isArray(list)) return false;
  applyingRemoteLogicState = true;
  try{
    blueprints.length = 0;
    for(const raw of list){
      const bp = expandBlueprint(cloneBlueprint(raw));
      if(bp && Array.isArray(bp.nodes)) blueprints.push(bp);
    }
    blueprintLibraryVersion++;
    lastBlueprintSerializedVersion = -1;
    lastBlueprintSentVersion = blueprintLibraryVersion;
    clampBlueprintScroll();
    return true;
  }finally{
    applyingRemoteLogicState = false;
  }
}

function sendBlueprintLibrary(){
  if(!logicSyncReady || applyingRemoteLogicState) return;
  if(lastBlueprintSentVersion === blueprintLibraryVersion) return;
  const payload = {version:1,blueprints:getBlueprintSyncData()};
  lastBlueprintSentVersion = blueprintLibraryVersion;
  setServerStatus("Blueprint-Änderung wird an den Server gesendet ...");
  logicSocket.emit("blueprintLibraryChange", payload);
}

logicSocket.on("connect", () => {
  setServerStatus("Verbunden, warte auf Serverstand ...");
});
logicSocket.on("disconnect", () => {
  setServerStatus("Verbindung zum Server getrennt.");
});
logicSocket.on("connect_error", () => {
  setServerStatus("Verbindung fehlgeschlagen.");
});
logicSocket.on("stateAck", ack => {
  if(Number.isInteger(ack?.serverRevision) && ack.serverRevision >= logicServerRevision){
    logicServerRevision = ack.serverRevision;
    setServerStatus("Server = Client · deine Änderung wurde gespeichert (Version "+logicServerRevision+").");
  }
});
logicSocket.on("stateRejected", info => {
  if(Number.isInteger(info?.serverRevision)) logicServerRevision = info.serverRevision;
  pendingLogicSnapshot = "";
  setServerStatus("Server ≠ Client · dein Stand war veraltet, Serverstand wird übernommen ...");
});

logicSocket.on("blueprintLibrary", library => {
  if(library && Array.isArray(library.blueprints)){
    applyBlueprintLibraryState(library.blueprints);
  }
});

logicSocket.on("state", state => {
  const incomingRevision = Number.isInteger(state?.serverRevision) ? state.serverRevision : 0;
  if(incomingRevision < logicServerRevision) return;
  logicServerRevision = incomingRevision;

  const isOwnConfirmedChange = state?.sourceSocketId === logicSocket.id;
  if(isOwnConfirmedChange){
    setServerStatus("Server = Client · deine Änderung wurde vom Server bestätigt (Version "+incomingRevision+").");
  }else if(state?.sourceSocketId && state.sourceSocketId !== "server-rejected"){
    setServerStatus("Server ≠ Client · anderer Benutzer hat geändert, Client wird aktualisiert ...");
  }else{
    setServerStatus("Serverstand wird übernommen (Version "+incomingRevision+") ...");
  }

  const legacyState = !state || Number(state.version || 1) < 3;

  const hasBlueprintLibrary = state && Array.isArray(state.blueprints);

  if(state && Array.isArray(state.nodes) && Array.isArray(state.wires)){
    if(applyLogicState(state)){
      if(Number.isInteger(incomingRevision)) logicSocket.emit("stateApplied", incomingRevision);
      // Dieser Snapshot ist jetzt der verbindlich bestätigte Serverstand.
      lastLogicSnapshot = serializeLogicState();
      pendingLogicSnapshot = "";
      if(!legacyState) setServerEqualStatus();
    }else{
      setServerStatus("Server ≠ Client · Serverstand wartet, bis die aktuelle Aktion fertig ist.");
    }
  }

  if(hasBlueprintLibrary) applyBlueprintLibraryState(state.blueprints);

  logicSyncReady = true;

  if(hasBlueprintLibrary){
    lastBlueprintSentVersion = blueprintLibraryVersion;
  }else{
    lastBlueprintSentVersion = -1;
    sendBlueprintLibrary();
  }

  if(legacyState){
    lastLogicSnapshot = "";
    pendingLogicSnapshot = "";
    sendLogicState();
  }else if(!lastLogicSnapshot){
    lastLogicSnapshot = serializeLogicState();
    setServerEqualStatus();
  }
});

// Synchronisiert nur:
// - Blöcke, Typen und Positionen
// - Wire-Verbindungen
// - Key-Zuweisungen
// - Switch-/Output-Namen
// - Switch-AN/AUS-Zustand
// - Timerwerte
// - Clock-Frequenzen
// - Blueprint-Bibliothek
// Laufende Zustände wie Memory-Zustände, Clock-/Timer-Laufzustände
// und gedrückte Tasten bleiben lokal. Der Switch-AN/AUS-Zustand wird bewusst synchronisiert.
setInterval(() => {
  if(!logicSyncReady || applyingRemoteLogicState) return;

  // Während man einen Block bewegt, darf der Server die Mausbewegung
  // nicht zurücksetzen. Danach wird der aktuelle Stand übertragen.
  if(drag || groupDragging || chipDrag || libraryDrag || selecting) return;

  const snapshot = serializeLogicState();
  if(snapshot !== lastLogicSnapshot && snapshot !== pendingLogicSnapshot){
    sendLogicState();
  }else if(snapshot === lastLogicSnapshot && !pendingLogicSnapshot){
    setServerEqualStatus();
  }
  sendBlueprintLibrary();
}, 50);

  })).filter(n => !n.hidden);

  });

function applyAiActions(actions){
  if(!Array.isArray(actions)||!actions.length)return {changed:0,details:[]};
  const allowed=["switch","lamp","not","or3","and","or","xor","timer","output","key","clock","memory","led"];
  let changed=0;
  const details=[];

  for(const a of actions){
    if(!a || typeof a.action!=="string") continue;

    if(a.action==="add_gate"){
      if(!allowed.includes(a.type)) continue;
      const n=new Node(Number(a.x)||0,Number(a.y)||0,a.type);
      if(typeof a.name==="string"&&a.name.trim()) n.name=a.name.trim();
      nodes.push(n);
      changed++;
      details.push("Gatter hinzugefügt");
      continue;
    }

    if(a.action==="delete_gate"){
      const i=Number(a.index);
      if(Number.isInteger(i)&&i>=0&&i<nodes.length){
        const target=nodes[i];
        for(let w=wires.length-1;w>=0;w--){
          if(wires[w].from===target||wires[w].to===target) wires.splice(w,1);
        }
        nodes.splice(i,1);
        changed++;
        details.push("Gatter gelöscht");
      }
      continue;
    }

    if(a.action==="move_gate"){
      const i=Number(a.index);
      if(Number.isInteger(i)&&i>=0&&i<nodes.length){
        nodes[i].x=Number(a.x)||0;
        nodes[i].y=Number(a.y)||0;
        changed++;
        details.push("Gatter verschoben");
      }
      continue;
    }

    if(a.action==="connect"){
      const from=Number(a.from), to=Number(a.to), inputIndex=Number.isInteger(Number(a.inputIndex))?Number(a.inputIndex):0;
      if(Number.isInteger(from)&&Number.isInteger(to)&&nodes[from]&&nodes[to]&&nodes[from].chipPin!=="in"&&nodes[to].chipPin!=="out"){
        const exists=wires.some(w=>w.from===nodes[from]&&w.to===nodes[to]&&w.inputIndex===inputIndex);
        if(!exists){wires.push({from:nodes[from],to:nodes[to],inputIndex});changed++;details.push("Wire verbunden");}
      }
      continue;
    }

    if(a.action==="disconnect"){
      const from=Number(a.from), to=Number(a.to);
      if(Number.isInteger(from)&&Number.isInteger(to)&&nodes[from]&&nodes[to]){
        for(let i=wires.length-1;i>=0;i--){
          if(wires[i].from===nodes[from]&&wires[i].to===nodes[to] &&
             (!Number.isInteger(Number(a.inputIndex)) || wires[i].inputIndex===Number(a.inputIndex))){
            wires.splice(i,1); changed++; details.push("Wire getrennt");
          }
        }
      }
      continue;
    }

    if(a.action==="rename_gate"){
      const i=Number(a.index);
      if(Number.isInteger(i)&&i>=0&&i<nodes.length&&typeof a.name==="string"){
        nodes[i].name=a.name;
        changed++; details.push("Gatter umbenannt");
      }
      continue;
    }

    if(a.action==="set_switch"){
      const i=Number(a.index);
      if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i].type==="switch"){
        nodes[i].state=!!a.state;
        changed++; details.push("Schalter gesetzt");
      }
      continue;
    }

    if(a.action==="set_timer"){
      const i=Number(a.index);
      if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i].type==="timer"){
        if(Number.isFinite(Number(a.delay))) nodes[i].delay=Number(a.delay);
        if(typeof a.stay==="boolean") nodes[i].stay=a.stay;
        changed++; details.push("Timer geändert");
      }
      continue;
    }

    if(a.action==="set_clock"){
      const i=Number(a.index);
      if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i].type==="clock"){
        if(Number.isFinite(Number(a.interval))) nodes[i].interval=Number(a.interval);
        changed++; details.push("Clock geändert");
      }
      continue;
    }
  }

  if(changed){
    clearSelection();
    sendLogicState();
  }
  return {changed,details};
}

aiBtn.addEventListener("click", () => {
  aiPopup.style.display = "block";
  aiPrompt.focus();
});

aiAsk.addEventListener("click", async () => {
  const prompt = aiPrompt.value.trim();
  if(!prompt) return;

  aiAsk.disabled = true;
  aiStatus.textContent = "Gemini denkt ...";

  try{
    const response = await fetch("/api/gemini", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt, context:getAiContext()})
    });
    const data = await response.json();

    if(!response.ok){
      throw new Error((data?.error || "Unbekannter Fehler") + (data?.details ? " — " + data.details : ""));
    }

    const result = applyAiActions(data.actions);
    aiStatus.textContent = (data.text || "Gemini hat keine Antwort geliefert.") +
      (result.changed ? "\n\nEditor geändert: "+result.details.join(", ")+".\nDie Änderung wurde an den Server gesendet." : "\n\nKeine Editor-Aktion ausgeführt.");
  }catch(error){
    aiStatus.textContent = "Fehler: " + error.message;
  }finally{
    aiAsk.disabled = false;
  }
});
</script>
