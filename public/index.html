300px;}button{background:rgba(20,25,35,.9);border:2px solid #00ffff;color:#fff;cursor:pointer;padding:8px 16px;border-radius:9px;font-weight:bold;transition:all 0.2s;}button:hover{background:rgba(0,255,255,.15);box-shadow:0 0 12px rgba(0,255,255,.4);}input[type="text"],input[type="number"],input[type="checkbox"]{background:rgba(20,25,35,.9);border:2px solid #00ffff;color:#fff;padding:6px;border-radius:7px;font-family:Arial;}input[type="checkbox"]{width:20px;height:20px;cursor:pointer;}input::placeholder{color:rgba(255,255,255,.4);}#menuPopup button,#bpPopup button,#copyPopup button,#timerMenu button,#namePopup button,#keyPopup button,#clockMenu button,#bpActionPopup button,#bpImport button{width:100%;margin:4px 0;}

<input id="tickOff" type="checkbox"> Aus

try{const _d=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(ctx),"shadowBlur");if(_d&&_d.get&&_d.set)Object.defineProperty(ctx,"shadowBlur",{configurable:true,get(){return _d.get.call(ctx);},set(v){_d.set.call(ctx,Math.max(0,Math.min(v,128)));},});}catch(e){}

let drag=null,connectFrom=null,selecting=false,selectionStart={x:0,y:0},selectionEnd={x:0,y:0},selectionBox=null,selectedNodes=[],selectionActive=false,groupDragging=false,blueprint=null,blueprints=[];

const socket=io();

function themeBlue(){return simpleGraphics?SIMPLE_BLUE:COMPLEX_BLUE;}
function uiRadius(){return 0;}
const preblueprints=[{"name":"PONG","chip":false,"mixedChipSelection":false,"nodes":[{"id":1,"type":"output","relX":1000,"relY":0,"name":" "},{"id":2,"type":"output","relX":1865,"relY":0,"name":" "},{"id":3,"type":"and","relX":700,"relY":200,"name":""},{"id":4,"type":"or","relX":500,"relY":400,"name":""},{"id":5,"type":"not","relX":200,"relY":100,"name":""},{"id":6,"type":"switch","relX":0,"relY":0,"name":"START"},{"id":7,"type":"switch","relX":0,"relY":100,"name":"RESET"},{"id":8,"type":"timer","relX":200,"relY":200,"name":"","delay":500,"stay":false},{"id":9,"type":"output","relX":900,"relY":100,"name":"BALL_X"},{"id":10,"type":"output","relX":900,"relY":200,"name":"BALL_Y"}],"wires":[{"from":6,"fromIndex":0,"to":8,"toIndex":0},{"from":8,"fromIndex":0,"to":1,"toIndex":0},{"from":8,"fromIndex":0,"to":2,"toIndex":0}],"focus":{"x":-100,"y":-100,"w":2000,"h":300}}];

function updateModeUI(){modeToggle.textContent=mode==="pc"?"PC":"iPad";touchModeToggle.style.display=mode==="ipad"?"block":"none";touchModeToggle.textContent=touchMode==="left"?"Links":"Rechts";}
modeToggle.onclick=()=>{mode=mode==="pc"?"ipad":"pc";if(mode==="pc")touchMode="left";updateModeUI();};
touchModeToggle.onclick=()=>{touchMode=touchMode==="left"?"right":"left";updateModeUI();};
document.getElementById("menuBtn").onclick=()=>{let p=document.getElementById("menuPopup");document.getElementById("tickOff").checked=tickMs===0;document.getElementById("tickInput").disabled=tickMs===0;document.getElementById("tickInput").value=tickMs||"";p.style.display=p.style.display==="flex"?"none":"flex";};

document.getElementById("hidePinsBtn").onclick=()=>{hiddenInputPins=!hiddenInputPins;updateHidePinsButton();};
updateHidePinsButton();

function applyUiSkin(){const base={borderRadius:"16px",boxShadow:"0 12px 28px rgba(0,0,0,.45)",backdropFilter:"blur(14px)",WebkitBackdropFilter:"blur(14px)",fontFamily:"Arial"};Object.assign(modeToggle.style,base);Object.assign(touchModeToggle.style,base);Object.assign(menuBtn.style,base);Object.assign(document.getElementById("menuPopup").style,base);Object.assign(document.getElementById("bpPopup").style,base);Object.assign(document.getElementById("copyPopup").style,base);Object.assign(document.getElementById("bpActionPopup").style,base);Object.assign(document.getElementById("timerMenu").style,base);Object.assign(document.getElementById("keyPopup").style,base);Object.assign(document.getElementById("clockMenu").style,base);Object.assign(document.getElementById("namePopup").style,base);Object.assign(document.getElementById("bpImport").style,base);}
applyUiSkin();
function updateUiTheme(){
 const blue=themeBlue();
 const radius=simpleGraphics?"0px":"14px";
 const buttonRadius=simpleGraphics?"0px":"9px";
 const inputRadius=simpleGraphics?"0px":"7px";
 const ids=["modeToggle","touchModeToggle","menuBtn","menuPopup","bpPopup","copyPopup","bpActionPopup","timerMenu","keyPopup","clockMenu","namePopup","bpImport"];
 for(const id of ids){const el=document.getElementById(id);if(!el)continue;el.style.borderColor=blue;el.style.borderRadius=radius;}
 for(const el of document.querySelectorAll("#menuPopup button,#bpPopup button,#copyPopup button,#timerMenu button,#namePopup button,#keyPopup button,#clockMenu button,#bpActionPopup button,#bpImport button")){el.style.borderColor=blue;el.style.borderRadius=buttonRadius;}
 for(const el of document.querySelectorAll("#menuPopup input,#bpPopup input,#bpImport input,#timerMenu input,#namePopup input,#clockMenu input")){el.style.borderColor=blue;el.style.borderRadius=inputRadius;}
}
updateUiTheme();

function getHotbarLayout(){const items=[{type:"switch",label:"SWITCH",w:108},{type:"lamp",label:"LAMP",w:108},{type:"not",label:"NOT",w:104},{type:"or3",label:"OR3",w:122},{type:"and",label:"AND",w:120},{type:"or",label:"OR",w:100},{type:"xor",label:"XOR",w:100},{type:"output",label:"OUT",w:108},{type:"timer",label:"TIMER",w:108},{type:"key",label:"KEY",w:100},{type:"clock",label:"CLOCK",w:108},{type:"memory",label:"MEM",w:100},{type:"led",label:"LED",w:100}];let x=10,y=h-88;for(const item of items){item.x=x;item.y=y;item.h=80;x+=item.w+10;}return items;}
function getHotbarItemAt(sx,sy){const items=getHotbarLayout();for(const item of items){if(sx>=item.x&&sx<=item.x+item.w&&sy>=item.y&&sy<=item.y+item.h)return item;}return null;}
function drawHotbar(){const items=getHotbarLayout();ctx.fillStyle="rgba(10,15,22,.92)";ctx.fillRect(0,h-92,w,92);ctx.strokeStyle="#00ffff";ctx.lineWidth=2;ctx.strokeRect(0,h-92,w,92);for(const item of items){ctx.save();ctx.fillStyle="rgba(0,255,255,.08)";ctx.fillRect(item.x,item.y,item.w,item.h);ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.textAlign="center";ctx.fillText(item.label,item.x+item.w/2,item.y+item.h-8);ctx.restore();}}

const LED_COLORS=["#000000","#7A0000","#E4272F","#FF8A00","#FFD400","#1FA83C","#7ED957","#7FD8E8","#2A6DF4","#103A8C","#8E4FE0","#E23BE2","#7A4B25","#4A2E14","#8C8C90","#FFFFFF"];
function ledColorIndex(inputs){let r=0,g=0,b=0;if(inputs[0]?.value)r=1;if(inputs[1]?.value)g=1;if(inputs[2]?.value)b=1;if(inputs[3]?.value)return 15;let idx=r*4+g*2+b;return idx;}
function roundPath(x,y,w,h,r){r=Math.min(r,Math.min(w,h)/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);}
function drawBeveledCard(x,y,w,h,accent,selected,alpha=1,shadow=14){ctx.save();ctx.globalAlpha=alpha;let g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,"rgba(255,255,255,.16)");g.addColorStop(0.5,"rgba(255,255,255,.04)");g.addColorStop(1,"rgba(0,0,0,.2)");ctx.shadowBlur=shadow;ctx.shadowColor=selected?"rgba(0,255,255,.6)":"rgba(0,0,0,.4)";ctx.fillStyle=g;roundPath(x,y,w,h,16);ctx.fill();ctx.strokeStyle=selected?"#ffffff":accent;ctx.lineWidth=selected?2.5:2;ctx.stroke();ctx.restore();}
function drawPort(px,py,active,selected,mode){ctx.save();ctx.beginPath();let glow=selected?32:(active?24:16);ctx.shadowBlur=glow;ctx.shadowColor=selected?"rgba(255,255,255,.95)":(active?"rgba(0,255,255,.85)":"rgba(0,255,136,.6)");ctx.fillStyle=selected?"#ffffff":(active?"#00ffff":"#00ff88");ctx.arc(px,py,selected?9:8,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.4)";ctx.lineWidth=1;ctx.stroke();ctx.restore();}
function drawWireGlow(s,e,active,color){ctx.save();ctx.lineCap="round";ctx.lineJoin="round";if(simpleGraphics){ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(e.x,e.y);ctx.strokeStyle=active?color:"rgb(120,132,150)";ctx.lineWidth=active?3:2;ctx.stroke();}else{ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(e.x,e.y);ctx.shadowBlur=active?18:6;ctx.shadowColor=active?color:"rgba(0,0,0,.3)";ctx.strokeStyle=active?color:"rgba(120,132,150,.45)";ctx.lineWidth=active?5:3;ctx.stroke();}ctx.restore();}
function drawTrace(pts,active,color,width){if(!pts||pts.length<2)return;ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);if(active){ctx.shadowBlur=16;ctx.shadowColor=color;}ctx.strokeStyle=active?color:"rgba(120,132,150,.45)";ctx.lineWidth=width;ctx.stroke();ctx.restore();}
function drawNodeDot(x,y,r,active,color){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=active?color:"rgba(108,120,138,.8)";if(active){ctx.shadowBlur=16;ctx.shadowColor=color;}ctx.fill();ctx.restore();}
function drawCtrlLink(x,y1,y2,active){ctx.save();ctx.setLineDash([3,3]);ctx.lineCap="butt";ctx.strokeStyle=active?"rgba(0,255,136,.9)":"rgba(120,132,150,.45)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
function drawGateShell(path,color){ctx.save();ctx.fillStyle="rgba(10,15,22,.94)";ctx.strokeStyle=color;ctx.lineWidth=3;path();ctx.fill();ctx.shadowBlur=12;ctx.shadowColor=color;ctx.stroke();ctx.restore();}

class Node{
 constructor(x,y,type){
  this.x=x;this.y=y;this.type=type;this.inputs=[];this.outputs=[];this.state=false;this.output=false;this.dragOffsetX=0;this.dragOffsetY=0;this.delay=1000;this.timerStart=0;this.timerRunning=false;this.offTimerRunning=false;this.offTimerStart=0;this.stay=false;this.name="";this.interval=1000;this.assignedKey="";this.clockState=true;this.clockLastToggle=performance.now();this.clockProgress=0;this.timerSweep=0;this.memoryState=false;this.hidden=false;this.chipId=null;this.chipPin=null;this.chipShell=null;this.ledColor="#000000";
  if(type==="switch"){this.inputs=[{x:0,y:30,value:false}];this.outputs=[{x:80,y:30}];}
  if(type==="lamp"){this.inputs=[{x:0,y:40,value:false}];this.outputs=[{x:90,y:40}];}
  if(type==="not"){this.inputs=[{x:0,y:30,value:false}];this.outputs=[{x:90,y:30}];}
  if(type==="or3"){this.inputs=[{x:0,y:14,value:false},{x:0,y:40,value:false},{x:0,y:66,value:false}];this.outputs=[{x:110,y:40}];}
  if(type==="and"){this.inputs=[{x:0,y:25,value:false},{x:0,y:55,value:false}];this.outputs=[{x:110,y:40}];}
  if(type==="or"){this.inputs=[{x:0,y:25,value:false},{x:0,y:55,value:false}];this.outputs=[{x:110,y:40}];}
  if(type==="xor"){this.inputs=[{x:0,y:25,value:false},{x:0,y:55,value:false}];this.outputs=[{x:110,y:40}];}
  if(type==="timer"){this.inputs=[{x:0,y:40,value:false}];this.outputs=[{x:110,y:40}];}
  if(type==="output"){this.inputs=[{x:0,y:30,value:false}];this.outputs=[{x:100,y:30}];}
  if(type==="key"){this.outputs=[{x:100,y:40}];}
  if(type==="clock"){this.outputs=[{x:100,y:40}];}
  if(type==="memory"){this.inputs=[{x:0,y:25,value:false},{x:0,y:55,value:false},{x:0,y:80,value:false}];this.outputs=[{x:110,y:50}];this.memoryState=false;}
  if(type==="led"){this.inputs=[{x:0,y:16,value:false},{x:0,y:38,value:false},{x:0,y:60,value:false},{x:0,y:82,value:false}];this.outputs=[];}
  if(this.chipPin){this.inputs=[{x:9,y:9,value:false}];this.outputs=[{x:11,y:11}];}
 }
 update(){
  switch(this.type){
   case "switch":{let external=this.inputs.some(i=>i.value);this.output=this.state||external;break;}
   case "lamp":this.output=this.inputs.some(i=>i.value);break;
   case "not":this.output=!this.inputs.some(i=>i.value);break;
   case "or3":this.output=!!(this.inputs[0]?.value||this.inputs[1]?.value||this.inputs[2]?.value);break;
   case "and":this.output=!!(this.inputs[0]?.value&&this.inputs[1]?.value);break;
   case "or":this.output=!!(this.inputs[0]?.value||this.inputs[1]?.value);break;
   case "xor":this.output=!!(this.inputs[0]?.value^this.inputs[1]?.value);break;
   case "memory":{let data=this.inputs[0]?.value;let en=this.inputs[1]?.value;let outEn=this.inputs[2]?.value;if(en)this.memoryState=!!data;this.output=!!(outEn&&this.memoryState);break;}
   case "led":this.ledColor=LED_COLORS[ledColorIndex(this.inputs)];break;
   case "output":this.output=this.inputs.some(i=>i.value);break;
   case "key":this.output=!!(this.assignedKey&&pressedKeys.has(this.assignedKey));break;
   case "clock":{let now=performance.now();let interval=Math.max(1,parseInt(this.interval)||1000);let dtc=now-this.clockLastToggle;if(dtc>=interval){this.clockLastToggle=dtc<interval*2?this.clockLastToggle+interval:now;this.clockState=!this.clockState;}this.clockProgress=(dtc%interval)/interval;this.output=this.clockState;break;}
   case "timer":{let active=this.inputs.some(i=>i.value);let now=performance.now();let delay=Math.max(1,parseInt(this.delay)||1000);if(active){if(!this.timerRunning){this.timerRunning=true;this.timerStart=now;}let elapsed=now-this.timerStart;if(elapsed>=delay){this.timerRunning=false;if(!this.stay)this.offTimerRunning=true,this.offTimerStart=now;this.output=true;}else{this.output=false;}this.timerSweep=Math.min(1,elapsed/delay);}else{if(this.timerRunning){this.timerRunning=false;if(!this.stay)this.offTimerRunning=true,this.offTimerStart=now;}if(this.offTimerRunning){let elapsed=now-this.offTimerStart;if(elapsed>=50){this.offTimerRunning=false;this.output=false;}}}break;}
  }
 }
 draw(alpha=1){
  if(this.hidden)return;
  if(simpleGraphics){
   ctx.save();
   ctx.globalAlpha=alpha;
   ctx.translate(this.x,this.y);
   if(this.chipPin){
    let p=this.chipPin==="out"?(this.outputs?.[0]||this.inputs?.[0]||{x:11,y:11}):(this.inputs?.[0]||this.outputs?.[0]||{x:11,y:11});
    let active=this.chipPin==="in"?(this.inputs?.[0]?.value):!!this.output;
    ctx.fillStyle=active?"#00ffff":"#ffffff";
    ctx.beginPath();
    ctx.arc(p.x,p.y,8,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.35)";
    ctx.lineWidth=1;
    ctx.stroke();
    if(!hiddenNames){ctx.fillStyle="#fff";ctx.font="10px Arial";ctx.fillText(this.name||"",15,11);}
    ctx.restore();
    return;
   }
   let s=getNodeSize(this);
   let w2=s.w,h2=s.h;
   let active=this.output||(this.inputs&&this.inputs.some(i=>i.value));
   let selected=selectedNodes.includes(this)||selectedNodes.some(n=>n.chipId&&n.chipId===this.chipId);
   if(this.type==="led"){
    ctx.fillStyle=this.ledColor;
    ctx.fillRect(0,0,w2,h2);
    if(!hiddenInputPins){for(let inp of this.inputs){ctx.beginPath();ctx.fillStyle=inp.value?"#00ffff":"#888";ctx.arc(inp.x,inp.y,6,0,Math.PI*2);ctx.fill();}}
    ctx.restore();
    return;
   }
   if(this.type==="switch"){
    ctx.fillStyle=this.output?"#00ff88":"#333";
    ctx.shadowBlur=20;
    ctx.shadowColor=this.output?"#00ff88":"transparent";

function getChipNodesById(id){return nodes.filter(n=>n.chipId===id);}
function getChipShellRect(id){let chipNodes=getChipNodesById(id);let shellNode=chipNodes.find(n=>n.chipShell&&Number.isFinite(n.chipShell.x)&&Number.isFinite(n.chipShell.y)&&Number.isFinite(n.chipShell.w)&&Number.isFinite(n.chipShell.h));return shellNode?shellNode.chipShell:null;}
function isChipSelected(id){return selectedNodes.some(n=>n.chipId===id);}
function getChipIdAtPoint(x,y){for(let i=nodes.length-1;i>=0;i--){let n=nodes[i];if(!n.chipId)continue;let shell=getChipShellRect(n.chipId);if(shell&&x>=shell.x&&x<=shell.x+shell.w&&y>=shell.y&&y<=shell.y+shell.h)return n.chipId;}return null;}
function moveChip(id,dx,dy){if(!Number.isFinite(dx)||!Number.isFinite(dy)||!id)return;let chipNodes=getChipNodesById(id);if(!chipNodes.length)return;let shellNode=chipNodes.find(n=>n.chipShell&&Number.isFinite(n.chipShell.x)&&Number.isFinite(n.chipShell.y)&&Number.isFinite(n.chipShell.w)&&Number.isFinite(n.chipShell.h));if(shellNode){shellNode.chipShell.x+=dx;shellNode.chipShell.y+=dy;for(let n of chipNodes){if(n!==shellNode){n.x+=dx;n.y+=dy;}}}if(!isApplyingRemoteState){broadcastStateChange();}}
function renderVisibilityMenu(){menuList.innerHTML="";const items=[{key:"switch",label:"SWITCH"},{key:"lamp",label:"LAMP"},{key:"not",label:"NOT"},{key:"or3",label:"OR3"},{key:"and",label:"AND"},{key:"or",label:"OR"},{key:"xor",label:"XOR"},{key:"output",label:"OUTPUT"},{key:"timer",label:"TIMER"},{key:"key",label:"KEY"},{key:"clock",label:"CLOCK"},{key:"memory",label:"MEMORY"},{key:"led",label:"LED"}];for(const item of items){let label=document.createElement("label");label.style.cssText="color:white;display:flex;gap:8px;align-items:center;";let checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.checked=nodeVisibility[item.key];checkbox.onchange=(e)=>{nodeVisibility[item.key]=e.target.checked;};let text=document.createElement("span");text.textContent=item.label;label.appendChild(checkbox);label.appendChild(text);menuList.appendChild(label);}}

function serializeState(){
 let nodeList=[];
 let nodeMap=new Map();
 for(let i=0;i<nodes.length;i++){
  nodeMap.set(nodes[i],i);
  nodeList.push({
   type:nodes[i].type,
   x:nodes[i].x,
   y:nodes[i].y,
   name:nodes[i].name,
   state:nodes[i].state,
   memoryState:nodes[i].memoryState,
   delay:nodes[i].delay,
   stay:nodes[i].stay,
   interval:nodes[i].interval,
   assignedKey:nodes[i].assignedKey,
   hidden:nodes[i].hidden,
   chipId:nodes[i].chipId,
   chipPin:nodes[i].chipPin,
   chipShell:nodes[i].chipShell
  });
 }
 let wireList=[];
 for(let wire of wires){
  let fromIdx=nodeMap.get(wire.from);
  let toIdx=nodeMap.get(wire.to);
  if(typeof fromIdx==="number"&&typeof toIdx==="number"){
   wireList.push({
    from:fromIdx,
    to:toIdx,
    inputIndex:wire.inputIndex||0
   });
  }
 }
 return{
  tickMs:tickMs,
  nodes:nodeList,
  wires:wireList
 };
}

function deserializeState(data){
 if(!data||!data.nodes)return;
 tickMs=data.tickMs||0;
 let newNodes=[];
 for(let nd of data.nodes){
  let n=new Node(nd.x,nd.y,nd.type);
  n.name=nd.name||"";
  n.state=nd.state||false;
  n.memoryState=nd.memoryState||false;
  n.delay=nd.delay||1000;
  n.stay=nd.stay||false;
  n.interval=nd.interval||1000;
  n.assignedKey=nd.assignedKey||"";
  n.hidden=nd.hidden||false;
  n.chipId=nd.chipId||null;
  n.chipPin=nd.chipPin||null;
  n.chipShell=nd.chipShell||null;
  newNodes.push(n);
 }
 nodes.length=0;
 nodes.push(...newNodes);
 let newWires=[];
 for(let wd of data.wires){
  if(wd.from>=0&&wd.from<nodes.length&&wd.to>=0&&wd.to<nodes.length){
   newWires.push({
    from:nodes[wd.from],
    to:nodes[wd.to],
    inputIndex:wd.inputIndex||0
   });
  }
 }
 wires.length=0;
 wires.push(...newWires);
 clearSelection();
}

function broadcastStateChange(){
 if(isApplyingRemoteState)return;
 let currentState=serializeState();
 let currentStateString=JSON.stringify(currentState);
 if(currentStateString===lastSentStateString)return;
 lastSentStateString=currentStateString;
 socket.emit("stateChange",currentState);
}

socket.on("state",(data)=>{
 isApplyingRemoteState=true;
 deserializeState(data);
 isApplyingRemoteState=false;
});

socket.on("connect",()=>{});

function handleCanvasMouseMove(e){
 mouseScreen.x=e.clientX;
 mouseScreen.y=e.clientY;
 if(blueprintScrollDrag)setBlueprintScrollFromY(e.clientY);
 if(rightRenameCandidate&&Math.hypot(e.clientX-rightRenameCandidate.startX,e.clientY-rightRenameCandidate.startY)>8)rightRenameCandidate.moved=true;
 if(timerMenuCandidate&&Math.hypot(e.clientX-timerMenuCandidate.startX,e.clientY-timerMenuCandidate.startY)>8)timerMenuCandidate.moved=true;
 if(keyMenuCandidate&&Math.hypot(e.clientX-keyMenuCandidate.startX,e.clientY-keyMenuCandidate.startY)>8)keyMenuCandidate.moved=true;
 if(clockMenuCandidate&&Math.hypot(e.clientX-clockMenuCandidate.startX,e.clientY-clockMenuCandidate.startY)>8)clockMenuCandidate.moved=true;
 if(panning){offsetX+=e.movementX;offsetY+=e.movementY;}
 updateMouseWorld();
 if(chipDrag){let dx=mouseWorld.x-chipDrag.lastX;let dy=mouseWorld.y-chipDrag.lastY;if(Number.isFinite(dx)&&Number.isFinite(dy)&&(dx||dy))moveChip(chipDrag.id,dx,dy);chipDrag.lastX=mouseWorld.x;chipDrag.lastY=mouseWorld.y;}
 if(groupDragging&&selectionActive&&selectionBox){let dx=e.movementX/zoom;let dy=e.movementY/zoom;let movedChipIds=new Set();for(let n of expandActionNodes(selectedNodes)){if(n.chipId){if(!movedChipIds.has(n.chipId)){movedChipIds.add(n.chipId);moveChip(n.chipId,dx,dy);}}else{n.x+=dx;n.y+=dy;}}if(!isApplyingRemoteState)broadcastStateChange();}
 if(selecting){selectionEnd.x=mouseWorld.x;selectionEnd.y=mouseWorld.y;}
 if(drag){drag.x=mouseWorld.x-drag.dragOffsetX;drag.y=mouseWorld.y-drag.dragOffsetY;}
}

function handleCanvasMouseDown(e){
 mouseScreen.x=e.clientX;
 mouseScreen.y=e.clientY;
 updateMouseWorld();
 if(e.button===0&&selectionActive&&selectionWireMode){
  let target=getConnectTargetAtPoint(mouseWorld.x,mouseWorld.y);
  if(target){
   let pinHit=getPinHitAtPoint(mouseWorld.x,mouseWorld.y,target);
   if(selectionWireMode==="from")connectSelectionToTarget(target,pinHit);
   else if(selectionWireMode==="to")connectSourceToSelection(target);
  }
  selectionWireMode=null;
  if(!isApplyingRemoteState)broadcastStateChange();
  return;
 }
 let additiveSelect=e.ctrlKey||e.metaKey||pressedKeys.has("KeyQ");
 if(!additiveSelect&&!selectionWireMode){
  let inside=selectionActive&&selectionBox&&pointInSelection(mouseWorld.x,mouseWorld.y);
  if(!inside&&(selectionActive||batchConnect))cancelSelectionContext();
 }
 if(isInLibraryPanel(e.clientX,e.clientY)){
  let thumb=getLibraryScrollThumbRect();
  let track=getLibraryScrollTrackRect();
  let idx=getLibraryItemIndexAt(e.clientX,e.clientY);
  if(thumb&&e.clientX>=thumb.x&&e.clientX<=thumb.x+thumb.w&&e.clientY>=thumb.y&&e.clientY<=thumb.y+thumb.h){
   if(e.button===0){blueprintScrollDrag=true;blueprintScrollDragOffset=e.clientY-thumb.y;return;}
  }
  if(track&&e.clientX>=track.x&&e.clientX<=track.x+track.w&&e.clientY>=track.y&&e.clientY<=track.y+track.h&&e.button===0){
   blueprintScrollDrag=true;
   blueprintScrollDragOffset=Math.max(0,thumb?thumb.h/2:10);
   setBlueprintScrollFromY(e.clientY);
   return;
  }
  if(idx!==-1){
   if(e.button===2){openBlueprintActionPopup(idx);return;}
   libraryDrag={bp:cloneBlueprint(blueprints[idx])};
   return;
  }
 }
 panning=false;
 groupDragging=false;
 if(blueprint&&e.button===0){
  placeBlueprint(blueprint,mouseWorld.x,mouseWorld.y);
  blueprint=null;
  return;
 }
 if(selectionActive&&e.button===0&&pointInSelection(mouseWorld.x,mouseWorld.y)){
  groupDragging=true;
  return;
 }
 if(e.button===0){
  let cid=getChipIdAtPoint(mouseWorld.x,mouseWorld.y);
  if(cid){
   drag=null;
   connectFrom=null;
   selecting=false;
   groupDragging=false;
   selectionWireMode=null;
   blueprintScrollDrag=false;
   chipDrag={id:cid,lastX:mouseWorld.x,lastY:mouseWorld.y};
   return;
  }
 }
 let hot=getHotbarItemAt(e.clientX,e.clientY);
 if(hot&&e.button===0){
  let n=new Node(mouseWorld.x,mouseWorld.y,hot.type);
  let ns=getNodeSize(n);
  n.x=mouseWorld.x-ns.w/2;
  n.y=mouseWorld.y-ns.h/2;
  nodes.push(n);
  drag=n;
  drag.dragOffsetX=ns.w/2;
  drag.dragOffsetY=ns.h/2;
  if(!isApplyingRemoteState)broadcastStateChange();
  return;
 }
 if(e.button===0){
  for(let i=nodes.length-1;i>=0;i--){
   let n=nodes[i];
   if(n.contains(mouseWorld.x,mouseWorld.y)){
    if(n.type==="switch"&&!n.chipId)n.state=!n.state;
    drag=n;
    drag.dragOffsetX=mouseWorld.x-n.x;
    drag.dragOffsetY=mouseWorld.y-n.y;
    return;
   }
  }
 }
 if(additiveSelect&&e.button===0){
  selecting=true;
  selectionStart={x:mouseWorld.x,y:mouseWorld.y};
  selectionEnd={x:mouseWorld.x,y:mouseWorld.y};
  return;
 }
 if(e.button===2){
  for(let i=nodes.length-1;i>=0;i--){
   let n=nodes[i];
   if(!n.contains(mouseWorld.x,mouseWorld.y))continue;
   if(n.type==="timer"){
    connectFrom=n;
    timerMenuCandidate={node:n,startX:e.clientX,startY:e.clientY,startTime:performance.now(),moved:false};
    return;
   }
   if(n.type==="key"){
    connectFrom=n;
    keyMenuCandidate={node:n,startX:e.clientX,startY:e.clientY,startTime:performance.now(),moved:false};
    return;
   }
   if(n.type==="clock"){
    connectFrom=n;
    clockMenuCandidate={node:n,startX:e.clientX,startY:e.clientY,startTime:performance.now(),moved:false};
    return;
   }
   connectFrom=n;
   if(!n.chipId&&(n.type==="switch"||n.type==="output")){
    rightRenameCandidate={node:n,startX:e.clientX,startY:e.clientY,startTime:performance.now(),moved:false};
   }
   return;
  }
 }
 panning=true;
}

function handleCanvasMouseUp(e){
 mouseScreen.x=e.clientX;
 mouseScreen.y=e.clientY;
 updateMouseWorld();
 panning=false;
 if(blueprintScrollDrag){blueprintScrollDrag=false;return;}

 if(timerMenuCandidate){
  let d=performance.now()-timerMenuCandidate.startTime;
  if(d<300&&!timerMenuCandidate.moved){
   openTimerPopup(timerMenuCandidate.node);
   timerMenuCandidate=null;
   connectFrom=null;
   return;
  }
  tryConnectFrom(timerMenuCandidate.node,mouseWorld.x,mouseWorld.y);
  timerMenuCandidate=null;
  connectFrom=null;
  return;
 }

 if(keyMenuCandidate){
  let d=performance.now()-keyMenuCandidate.startTime;
  if(d<300&&!keyMenuCandidate.moved){
   openKeyPopup(keyMenuCandidate.node);
   keyMenuCandidate=null;
   connectFrom=null;
   return;
  }
  tryConnectFrom(keyMenuCandidate.node,mouseWorld.x,mouseWorld.y);
  keyMenuCandidate=null;
  connectFrom=null;
  return;
 }

 if(clockMenuCandidate){
  let d=performance.now()-clockMenuCandidate.startTime;
  if(d<300&&!clockMenuCandidate.moved){
   openClockPopup(clockMenuCandidate.node);
   clockMenuCandidate=null;
   connectFrom=null;
   return;
  }
  tryConnectFrom(clockMenuCandidate.node,mouseWorld.x,mouseWorld.y);
  clockMenuCandidate=null;
  connectFrom=null;
  return;
 }

 if(chipDrag&&e.button===0){chipDrag=null;drag=null;connectFrom=null;return;}

 if(libraryDrag){
  if(!isInLibraryPanel(e.clientX,e.clientY)&&e.clientY<h-90){let px=mouseWorld.x,py=mouseWorld.y;placeBlueprint(libraryDrag.bp,px,py);focusOnBlueprint(libraryDrag.bp,px,py);}
  libraryDrag=null;
  return;
 }

 if(drag&&e.button===0){
  if(!isApplyingRemoteState)broadcastStateChange();
  drag=null;
 }

 if(selecting){
  selecting=false;
  let minX=Math.min(selectionStart.x,selectionEnd.x);
  let minY=Math.min(selectionStart.y,selectionEnd.y);
  let maxX=Math.max(selectionStart.x,selectionEnd.x);
  let maxY=Math.max(selectionStart.y,selectionEnd.y);
  let boxNodes=nodes.filter(n=>{
   if(n.hidden)return false;
   let r=getNodeRect(n);
   return r.x>=minX&&r.y>=minY&&r.x+r.w<=maxX&&r.y+r.h<=maxY;
  });
  selectedNodes=boxNodes;
  if(batchConnect&&batchConnect.phase==="target"){
   batchConnect.targetNodes=collectConnectionTargets(selectedNodes);
   batchConnect.targetBox=getSelectionBounds(batchConnect.targetNodes);
   selectionActive=!!batchConnect.targetNodes.length;
   selectionBox=batchConnect.targetBox;
   return;
  }
  if(selectedNodes.length){
   selectionBox=getSelectionBounds(selectedNodes);
   selectionActive=true;
  }else{
   clearSelection();
  }
  return;
 }

 groupDragging=false;

 if(e.button===2){
  if(rightRenameCandidate){
   let releasedNode=null;
   for(let i=nodes.length-1;i>=0;i--){
    if(nodes[i].contains(mouseWorld.x,mouseWorld.y)){
     releasedNode=nodes[i];
     break;
    }
   }
   if(rightRenameCandidate.node===releasedNode&&!rightRenameCandidate.moved&&!timerMenuCandidate&&performance.now()-rightRenameCandidate.startTime<300){
    openNamePopup(rightRenameCandidate.node);
    connectFrom=null;
    rightRenameCandidate=null;
    return;
   }
  }
  if(connectFrom){
   tryConnectFrom(connectFrom,mouseWorld.x,mouseWorld.y);
  }
  connectFrom=null;
  rightRenameCandidate=null;
  timerMenuCandidate=null;
  keyMenuCandidate=null;
  clockMenuCandidate=null;
 }
}

function focusOnBlueprint(bp,x,y){let f=bp&&bp.focus;if(!f)return;let z=Math.min((w-80)/f.w,(h-200)/f.h);zoom=Math.max(minZoom,Math.min(1,z));offsetX=(w-f.w*zoom)/2-(x+f.x)*zoom;offsetY=((h-84)-f.h*zoom)/2-(y+f.y)*zoom;}

canvas.addEventListener("mousemove",handleCanvasMouseMove);
canvas.addEventListener("mousedown",()=>{let a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();});
canvas.addEventListener("mousedown",handleCanvasMouseDown);
canvas.addEventListener("mouseup",handleCanvasMouseUp);
canvas.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{if(e.key==="Delete")deleteSelection();});

loadPreblueprints();
renderVisibilityMenu();

function tick(){
 for(let n of nodes){
  n.update();
  for(let inp of n.inputs||[]){inp.value=false;}
 }
 for(let wire of wires){
  if(wire.to.inputs&&wire.inputIndex<wire.to.inputs.length){
   wire.to.inputs[wire.inputIndex].value=wire.from.output;
  }
 }
 if(tickMs>0){
  let now=performance.now();
  if(now-lastTick>=tickMs){
   lastTick=now;
   for(let n of nodes){
    if(n.type==="switch"&&!n.chipId){
     n.output=n.state;
    }
   }
  }
 }
}

function draw(){
 ctx.fillStyle="#050505";
 ctx.fillRect(0,0,w,h);
 ctx.save();
 ctx.translate(offsetX,offsetY);
 ctx.scale(zoom,zoom);
 for(let wire of wires){
  let start=getWireAnchor(wire.from,"out");
  let end=getWireAnchor(wire.to,"in",wire.inputIndex||0);
  let active=wire.from.output;
  drawWireGlow(start,end,active,"#00ffff");
 }
 for(let n of nodes){
  n.draw();
 }
 if(selectionBox){
  ctx.strokeStyle="#00ff88";
  ctx.lineWidth=2;
  ctx.strokeRect(selectionBox.x,selectionBox.y,selectionBox.w,selectionBox.h);
 }
 if(selecting){
  let minX=Math.min(selectionStart.x,selectionEnd.x);
  let minY=Math.min(selectionStart.y,selectionEnd.y);
  let maxX=Math.max(selectionStart.x,selectionEnd.x);
  let maxY=Math.max(selectionStart.y,selectionEnd.y);
  ctx.fillStyle="rgba(0,255,136,.1)";
  ctx.fillRect(minX,minY,maxX-minX,maxY-minY);
  ctx.strokeStyle="#00ff88";
  ctx.lineWidth=2;
  ctx.strokeRect(minX,minY,maxX-minX,maxY-minY);
 }
 ctx.restore();
 drawHotbar();
 let libPanel=getLibraryPanelRect();
 ctx.fillStyle="rgba(10,15,22,.92)";
 ctx.fillRect(libPanel.x,libPanel.y,libPanel.w,libPanel.h);
 ctx.strokeStyle="#00ffff";
 ctx.lineWidth=2;
 ctx.strokeRect(libPanel.x,libPanel.y,libPanel.w,libPanel.h);
 ctx.fillStyle="#fff";
 ctx.font="bold 14px Arial";
 ctx.fillText("Library",libPanel.x+10,libPanel.y+28);
 ctx.save();
 ctx.beginPath();
 ctx.rect(libPanel.x,libPanel.y+36,libPanel.w,blueprintVisibleRows*34);
 ctx.clip();
 for(let i=0;i<blueprints.length;i++){
  let rect=getLibraryItemRect(i);
  if(!rect)continue;
  ctx.fillStyle="rgba(0,255,255,.1)";
  ctx.fillRect(rect.x,rect.y,rect.w,rect.h);
  ctx.fillStyle="#fff";
  ctx.font="12px Arial";
  ctx.fillText(blueprints[i].name||"Blueprint",rect.x+8,rect.y+18);
 }
 ctx.restore();
 let track=getLibraryScrollTrackRect();
 if(track){
  ctx.fillStyle="rgba(0,255,255,.15)";
  ctx.fillRect(track.x,track.y,track.w,track.h);
  let thumb=getLibraryScrollThumbRect();
  if(thumb){
   ctx.fillStyle="rgba(0,255,255,.4)";
   ctx.fillRect(thumb.x,thumb.y,thumb.w,thumb.h);
  }
 }
}

function animate(){
 tick();
 draw();
 pruneSelectionState();
 requestAnimationFrame(animate);
}

animate();

</script>
