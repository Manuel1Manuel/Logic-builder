function prettyKey(code){if(!code)return"";if(code.startsWith("Key"))return code.slice(3);if(code.startsWith("Digit"))return code.slice(5);if(code==="Space")return"Space";if(code==="Enter")return"Enter";if(code==="Escape")return"Esc";if(code==="ShiftLeft"||code==="ShiftRight")return"Shift";if(code==="ControlLeft"||code==="ControlRight")return"Ctrl";if(code==="AltLeft"||code==="AltRight")return"Alt";if(code==="ArrowUp")return"↑";if(code==="ArrowDown")return"↓";if(code==="ArrowLeft")return"←";if(code==="ArrowRight")return"→";return code.replace("Numpad","");}

function getFreeSlot(node){
 if(node.type==="switch")return 0;
 if(node.type==="not")return 0;
 let used=new Set(wires.filter(w=>w.to===node).map(w=>w.inputIndex));
 for(let i=0;i<node.inputs.length;i++)if(!used.has(i))return i;
 return -1;
}

function collectConnectionSources(list){
 return sortByPosition(expandActionNodes(list).filter(n=>!n.hidden)).filter(n=>n.chipId?n.chipPin==="out":(n.outputs&&n.outputs.length));
}

function collectConnectionTargets(list){
 return sortByPosition(expandActionNodes(list).filter(n=>!n.hidden)).filter(n=>n.chipId?n.chipPin==="in":(n.inputs&&n.inputs.length));
}

function canConnectNodes(from,to){
 if(!from||!to||from===to)return false;
 if(from.chipPin&&from.chipPin!=="out")return false;
 if(to.chipPin&&to.chipPin!=="in")return false;
 if(from.chipId&&to.chipId&&from.chipId===to.chipId)return false;
 return true;
}
function connectSelectionsPairwise(sourceNodes,targetNodes){
 let outs=collectSelectionPins(sourceNodes,"outputs");
 let ins=collectSelectionPins(targetNodes,"inputs");
 let o=0;
 for(let i=0;i<ins.length&&o<outs.length;i++){
  while(o<outs.length&&!canConnectNodes(outs[o].node,ins[i].node))o++;
  if(o>=outs.length)break;
  wires.push({from:outs[o].node,to:ins[i].node,inputIndex:ins[i].index});
  o++;
 }
}
function getOrderedInputSlots(node){
 let used=new Set(wires.filter(w=>w.to===node).map(w=>w.inputIndex));
 if(node&&node.chipPin)return[0];
 if(node&&node.inputs&&node.inputs.length){
  let slots=[];
  for(let i=0;i<node.inputs.length;i++)if(!used.has(i))slots.push(i);
  if(slots.length)return slots;
 }
 if(node&&(node.type==="switch"||node.type==="output"||node.type==="not"))return[0];
 return[];
}
function connectSelectionsChunked(sourceNodes,targetNodes){
 let outs=collectSelectionPins(sourceNodes,"outputs");
 let targets=sortByPosition(expandActionNodes(targetNodes).filter(n=>!n.hidden));
 let o=0;
 for(let target of targets){
  let slots=getOrderedInputSlots(target);
  for(let slot of slots){
   while(o<outs.length&&!canConnectNodes(outs[o].node,target))o++;
   if(o>=outs.length)return;
   wires.push({from:outs[o].node,to:target,inputIndex:slot});
   o++;
  }

function connectSelectionsFirstFree(sourceNodes,targetNodes){
 let outs=collectSelectionPins(sourceNodes,"outputs");
 let ins=collectSelectionPins(targetNodes,"inputs");
 let o=0;
 for(let i=0;i<ins.length&&o<outs.length;i++){
  while(o<outs.length&&!canConnectNodes(outs[o].node,ins[i].node))o++;
  if(o>=outs.length)break;
  wires.push({from:outs[o].node,to:ins[i].node,inputIndex:ins[i].index});
  o++;
 }
}
function startBatchConnect(mode="chunked"){

 if(!sourceNodes.length)return;
 batchConnect={
  sourceNodes:sortByPosition(sourceNodes),
  triggerNodes:sortByPosition(sourceNodes),
  selectionNodes:originalSelection,
  sourceBox:getSelectionBounds(sourceNodes),
  targetNodes:[],
  targetBox:null,
  phase:"target",
  connectMode:mode
 };
 clearSelection();
}
function finalizeBatchConnect(){
 if(!batchConnect)return;
 let targets=batchConnect.targetNodes.length?batchConnect.targetNodes:collectConnectionTargets(selectedNodes);
 if(batchConnect.connectMode==="parallel"){
  connectSelectionsParallel(batchConnect.selectionNodes||[],batchConnect.targetNodes.length?batchConnect.targetNodes:null);
 }else{
  if(!targets.length)return;
  if(batchConnect.connectMode==="firstFree")connectSelectionsFirstFree(batchConnect.sourceNodes,targets);
  else connectSelectionsPairwise(batchConnect.sourceNodes,targets);
 }
 let triggerNodes=batchConnect.triggerNodes||batchConnect.sourceNodes;
 batchConnect=null;
 clearSelection();
 restoreTriggerSelection(triggerNodes);
}

function runQuickConnect(mode){
 if(!selectionActive||!selectedNodes.length)return false;
 let sourceNodes=collectConnectionSources(selectedNodes);
 let targetNodes=collectConnectionTargets(selectedNodes);
 if(!sourceNodes.length||!targetNodes.length)return false;
 if(mode==="firstFree")connectSelectionsFirstFree(sourceNodes,targetNodes);
 else if(mode==="chunked")connectSelectionsChunked(sourceNodes,targetNodes);
 else connectSelectionsPairwise(sourceNodes,targetNodes);
 restoreTriggerSelection(sourceNodes);
 return true;
}

 if(e.key==="Delete"||e.key==="Backspace"){

 if(e.key.toLowerCase()==="c"){

 if(e.key.toLowerCase()==="b"){

function evaluate(){
 for(let n of nodes){
  for(let i of n.inputs)i.value=false;
 }
 let maxPasses=Math.max(1,nodes.length+5);
 for(let pass=0;pass<maxPasses;pass++){
  for(let n of nodes){
   let len=n.inputs.length;
   let a=n._nx;
   if(!a||a.length!==len)a=n._nx=new Array(len);
   for(let i=0;i<len;i++)a[i]=false;
  }
  for(let w of wires){
   if(!w||!w.from||!w.to)continue;
   if(!w.from.output)continue;
   let a=w.to._nx;
   if(!a)continue;
   if(w.inputIndex>=0&&w.inputIndex<a.length)a[w.inputIndex]=true;
  }
  let changed=false;
  for(let n of nodes){
   let a=n._nx,ins=n.inputs;
   for(let i=0;i<a.length;i++){
    if(ins[i].value!==a[i]){ins[i].value=a[i];changed=true;}
   }
  }
  for(let n of nodes)n.update();
  if(!changed)break;
 }
}

function getAiContext(userPrompt=""){
  const visibleNodes=nodes.map((n,index)=>({
    index,type:n.type,name:n.name||"",x:Math.round(n.x||0),y:Math.round(n.y||0),
    chipId:n.chipId||undefined,chipPin:n.chipPin||undefined,chipName:n.chipName||undefined,
    state:n.type==="switch"?!!n.state:undefined,
    delay:n.type==="timer"?Number(n.delay)||0:undefined,
    interval:n.type==="clock"?Number(n.interval)||1000:undefined,
    assignedKey:n.type==="key"?n.assignedKey||"":undefined
  })).filter(n=>!nodes[n.index].hidden);
  const nodeIndex=new Map(nodes.map((n,i)=>[n,i]));
  const wireData=wires.map(w=>({from:nodeIndex.get(w.from),to:nodeIndex.get(w.to),inputIndex:Number.isFinite(w.inputIndex)?w.inputIndex:0}));
  const promptText=String(userPrompt||"").trim().toLocaleLowerCase("de-DE");

  // Die Blueprint-Bibliothek ist für die KI vollständig unsichtbar,
  // solange der Nutzer nicht ausdrücklich nach einem Blueprint/Eintrag fragt.
  const requestedBlueprints=[];
  for(let i=0;i<blueprints.length;i++){
    const bp=blueprints[i];
    const name=String(bp.name||"").trim();
    if(name && promptText.includes(name.toLocaleLowerCase("de-DE"))){
      requestedBlueprints.push({index:i,name,blueprint:sanitizeBlueprintForStorage(cloneBlueprint(bp))});
    }
  }

  // KI-Wissen ist absichtlich NICHT Standardkontext. Es wird nur geladen,
  // wenn der Nutzer ausdrücklich danach fragt. Bei einem genannten Namen
  // wird nur der passende Eintrag geladen; eine allgemeine Bitte nach dem
  // KI-Wissen darf die komplette KI-Wissensbibliothek öffnen.
  // KIB = KI-Wissensbibliothek. Nur eine ausdrückliche KIB/KI-Wissens-Anfrage darf diesen Kontext öffnen.
  const asksForAiKnowledge=/(ki[- ]?wissen|ki[- ]?wissensbibliothek|mein(?:e|en)? gespeicher(?:t|te)(?:s|n)? wissen|gespeicher(?:t|te)(?:s|n)? ki[- ]?wissen|was weißt du über dein wissen|schau in dein ki[- ]?wissen|greif auf dein ki[- ]?wissen|nutze dein ki[- ]?wissen)/i.test(promptText);
  let aiKnowledge=[];
  if(asksForAiKnowledge){
    const knowledge=getAiKnowledgeLibrary();
    const named=knowledge.filter(entry=>{
      const name=String(entry.name||"").trim().toLocaleLowerCase("de-DE");
      return name && promptText.includes(name);
    });
    const selected=named.length?named:knowledge;
    aiKnowledge=selected.map((entry,index)=>({
      index:knowledge.indexOf(entry),
      createdAt:entry.createdAt||"",
      name:entry.name||("KI-Wissen "+(index+1)),
      understanding:entry.understanding||"",
      blueprint:entry.blueprint?sanitizeBlueprintForStorage(cloneBlueprint(entry.blueprint)):undefined
    }));
  }

  return JSON.stringify({
    editor:"Logic Builder Ultra",
    nodeCount:nodes.length,
    gateTypes:["switch","lamp","not","or3","and","or","xor","timer","output","key","clock","memory","led"],
    nodes:visibleNodes,
    wires:wireData,
    requestedBlueprints,
    aiKnowledge
  });
}

let aiActionInProgress=false;

function waitForAiStateAck(){
  return new Promise(resolve=>{
    let done=false;
    const finish=ok=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      logicSocket.off("stateAck",onAck);
      logicSocket.off("stateRejected",onRejected);
      resolve(ok);
    };
    const onAck=ack=>{
      if(ack && Number.isInteger(ack.serverRevision)) serverRevision=ack.serverRevision;
      finish(true);
    };
    const onRejected=info=>{
      if(info && Number.isInteger(info.serverRevision)) serverRevision=info.serverRevision;
      finish(false);
    };
    const timer=setTimeout(()=>finish(false),5000);
    logicSocket.once("stateAck",onAck);
    logicSocket.once("stateRejected",onRejected);
  });
}

async function applyAiActions(actions){
  if(!Array.isArray(actions)||!actions.length)return {changed:0,details:[]};
  const allowed=["switch","lamp","not","or3","and","or","xor","timer","key","clock","memory","led","output"];
  // KI-Modelle können bei derselben JSON-Aufgabe "action" oder "type" für den Aktionsnamen verwenden.
  // Der Editor akzeptiert intern "action"; normalisiere deshalb beide Formen, bevor die Aktionen ausgeführt werden.
  actions=actions.map(a=>{
    if(!a||typeof a!=="object")return a;
    if(typeof a.action==="string")return a;
    if(typeof a.type==="string"&&["add_gate","delete_gate","move_gate","connect","disconnect","rename_gate","set_switch","set_timer","set_clock","save_chip","copy_chip","place_blueprint","select_nodes","open_chip_popup","confirm_chip_save","update_ai_knowledge"].includes(a.type)){
      // Manche Modelle verwenden "type" für den Aktionsnamen. Bei add_gate
      // steckt der eigentliche Gattertyp dann in "gateType". Intern erwartet
      // der Editor aber action:"add_gate" und type:"switch"/"xor"/etc.
      if(a.type==="add_gate"){
        return {...a,action:"add_gate",type:(typeof a.gateType==="string"?a.gateType:(typeof a.nodeType==="string"?a.nodeType:""))};
      }
      return {...a,action:a.type};
    }
    return a;
  });
  let changed=0; const details=[];
  aiActionInProgress=true;
  try{
    // Alle normalen Änderungen werden zuerst lokal vollständig aufgebaut.
    // Löschungen kommen danach in absteigender Index-Reihenfolge, damit
    // das Verschieben der Array-Indizes keine weiteren Löschziele verfälscht.
    const normalActions=actions.filter(a=>a&&a.action!=="delete_gate");
    const deleteActions=actions
      .filter(a=>a&&a.action==="delete_gate")
      .sort((a,b)=>Number(b.index)-Number(a.index));

    const orderedActions=[...normalActions,...deleteActions];

    for(const a of orderedActions){
      if(!a||typeof a.action!=="string")continue;
      let didChange=false;
      if(a.action==="add_gate"&&allowed.includes(a.type)){
        const n=new Node(Number(a.x)||0,Number(a.y)||0,a.type);
        if(typeof a.name==="string"&&a.name.trim()&&a.type!=="lamp")n.name=a.name.trim();
        nodes.push(n); didChange=true; details.push("Gatter hinzugefügt");
      }else if(a.action==="delete_gate"){
        const i=Number(a.index);
        if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i].type!=="lamp"){
          const t=nodes[i];
          for(let j=wires.length-1;j>=0;j--)if(wires[j].from===t||wires[j].to===t)wires.splice(j,1);
          nodes.splice(i,1); didChange=true; details.push("Gatter gelöscht");
        }
      }else if(a.action==="move_gate"){
        const i=Number(a.index);
        if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i].type!=="lamp"){
          nodes[i].x=Number(a.x)||0; nodes[i].y=Number(a.y)||0; didChange=true; details.push("Gatter verschoben");
        }
      }else if(a.action==="connect"){
        const from=Number(a.from),to=Number(a.to),inputIndex=Number.isInteger(Number(a.inputIndex))?Number(a.inputIndex):0;
        if(nodes[from]&&nodes[to]&&!wires.some(w=>w.from===nodes[from]&&w.to===nodes[to]&&w.inputIndex===inputIndex)){
          wires.push({from:nodes[from],to:nodes[to],inputIndex}); didChange=true; details.push("Wire verbunden");
        }
      }else if(a.action==="disconnect"){
        const from=Number(a.from),to=Number(a.to);
        if(nodes[from]&&nodes[to])for(let j=wires.length-1;j>=0;j--)if(wires[j].from===nodes[from]&&wires[j].to===nodes[to]&&(!Number.isInteger(Number(a.inputIndex))||wires[j].inputIndex===Number(a.inputIndex))){wires.splice(j,1);didChange=true;details.push("Wire getrennt");}
      }else if(a.action==="rename_gate"){
        const i=Number(a.index);
        if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i].type!=="lamp"&&typeof a.name==="string"){nodes[i].name=a.name;didChange=true;details.push("Gatter umbenannt");}
      }else if(a.action==="set_switch"){
        const i=Number(a.index);
        if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i].type==="switch"){nodes[i].state=!!a.value;didChange=true;details.push("Schalter gesetzt");}
      }else if(a.action==="set_timer"){
        const i=Number(a.index);
        if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i].type==="timer"){if(Number.isFinite(Number(a.delay)))nodes[i].delay=Number(a.delay);if(typeof a.stay==="boolean")nodes[i].stay=a.stay;didChange=true;details.push("Timer geändert");}
      }else if(a.action==="set_clock"){
        const i=Number(a.index);
        if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i].type==="clock"&&Number.isFinite(Number(a.interval))){nodes[i].interval=Number(a.interval);didChange=true;details.push("Clock geändert");}
      }else if(a.action==="save_chip"){
        const i=Number(a.index);
        const source=Number.isInteger(i)&&i>=0&&i<nodes.length?nodes[i]:null;
        const bp0=buildBlueprintFromNodeCluster(source);
        if(bp0){
          const bp=bp0;
          bp.name=(typeof a.name==="string"&&a.name.trim())?a.name.trim():(bp.name||"CHIP");
          bp.chip=true;
          bp.mixedChipSelection=false;
          zeroBlueprintSwitches(bp);
          const storedBp=sanitizeBlueprintForStorage(bp);
          blueprints.push(storedBp);
          clampBlueprintScroll();
          didChange=true;
          details.push("Chip in Blueprint-Bibliothek gespeichert");
        }
      }else if(a.action==="copy_chip"){
        const i=Number(a.index);
        const source=Number.isInteger(i)&&i>=0&&i<nodes.length?nodes[i]:null;
        if(source&&Number.isFinite(Number(a.x))&&Number.isFinite(Number(a.y))){
          const bp=buildBlueprintFromNodeCluster(source);
          if(bp){
            bp.chip=true;
            bp.mixedChipSelection=false;
            placeBlueprint(bp,Number(a.x),Number(a.y));
            didChange=true;
            details.push("Chip vervielfältigt");
          }
        }
      }else if(a.action==="select_nodes"){
        const indices=Array.isArray(a.indices)?a.indices:[];
        const picked=[];
        for(const rawIndex of indices){
          const i=Number(rawIndex);
          if(Number.isInteger(i)&&i>=0&&i<nodes.length&&nodes[i]&&!nodes[i].hidden)picked.push(nodes[i]);
        }
        const expanded=expandActionNodes(picked).filter(n=>!n.hidden&&nodes.includes(n));
        selectedNodes=[...new Set(expanded)];
        selectionActive=!!selectedNodes.length;
        selectionBox=selectionActive?getSelectionBounds(selectedNodes):null;
        selectionWireMode=null;
        didChange=true;
        details.push("Auswahl gesetzt");
      }else if(a.action==="open_chip_popup"){
        if(selectionActive&&selectedNodes.length){
          saveBlueprintToLibrary();
          document.getElementById("bpChip").checked=true;
          didChange=true;
          details.push("Chip-Speicherfenster geöffnet");
        }
      }else if(a.action==="confirm_chip_save"){
        if(selectionActive&&selectedNodes.length&&!pendingBlueprint)saveBlueprintToLibrary();
        if(pendingBlueprint){
          document.getElementById("bpChip").checked=true;
          await new Promise(resolve=>setTimeout(resolve,450));
          document.getElementById("bpOk").click();
          didChange=true;
          details.push("Chip gespeichert");
        }
      }else if(a.action==="update_ai_knowledge"){
        const list=getAiKnowledgeLibrary();
        const i=Number(a.index);
        if(Number.isInteger(i)&&i>=0&&i<list.length){
          const entry=list[i];
          let changedEntry=false;
          if(typeof a.name==="string"&&a.name.trim()&&a.name.trim()!==String(entry.name||"")){
            entry.name=a.name.trim();
            changedEntry=true;
          }
          if(typeof a.understanding==="string"&&a.understanding.trim()!==String(entry.understanding||"").trim()){
            entry.understanding=a.understanding.trim();
            changedEntry=true;
          }
          if(changedEntry){
            setAiKnowledgeLibrary(list);
            renderAiLibrary();
            didChange=true;
            details.push("KI-Wissenseintrag bearbeitet");
          }
        }
      }else if(a.action==="place_blueprint"){
        const bi=Number(a.blueprintIndex);
        const bp=Number.isInteger(bi)&&bi>=0&&bi<blueprints.length?blueprints[bi]:null;
        if(bp&&Number.isFinite(Number(a.x))&&Number.isFinite(Number(a.y))){
          placeBlueprint(cloneBlueprint(bp),Number(a.x),Number(a.y));
          didChange=true;
          details.push("Blueprint platziert");
        }
      }
      if(didChange)changed++;
    }

    // Erst jetzt wird der komplette neue Zustand übertragen. Dadurch werden
    // große KI-Aufgaben wie ein Byte-Adder nicht mehr sichtbar Block für Block
    // über das Netzwerk abgespielt, sondern als eine sofortige Gesamtänderung.
    if(changed){
      clearSelection();
      const before=lastLogicSnapshot;
      const ackPromise=waitForAiStateAck();
      sendLogicState();
      if(lastLogicSnapshot!==before){
        await ackPromise;
      }
    }
  }finally{
    aiActionInProgress=false;
  }
  return {changed,details};
}

function streamedJsonString(raw,key){
  const marker = new RegExp('"'+key+'"\\s*:\\s*"');
  const match = marker.exec(raw);
  if(!match) return "";
  const start = match.index + match[0].length;
  let value = "", escaped = false, complete = false;
  for(let i=start;i<raw.length;i++){
    const ch=raw[i];
    if(!escaped && ch === '"'){complete=true;break;}
    value += ch;
    if(escaped) escaped=false;
    else if(ch === "\\") escaped=true;
  }
  if(complete){
    try{return JSON.parse('"'+value+'"');}catch{}
  }
  return value
    .replace(/\\n/g,"\n")
    .replace(/\\r/g,"\r")
    .replace(/\\t/g,"\t")
    .replace(/\\"/g,'"')
    .replace(/\\\\/g,"\\");
}

function countStreamedActions(raw){
  const match = /"actions"\s*:\s*\[/.exec(raw);
  if(!match)return 0;
  let depth=0,count=0,inString=false,escaped=false;
  for(let i=match.index+match[0].length;i<raw.length;i++){
    const ch=raw[i];
    if(inString){
      if(escaped)escaped=false;
      else if(ch==="\\")escaped=true;
      else if(ch==='"')inString=false;
      continue;
    }
    if(ch==='"'){inString=true;continue;}
    if(ch==="]"&&depth===0)break;
    if(ch==="{"){
      if(depth===0)count++;
      depth++;
    }else if(ch==="}")depth=Math.max(0,depth-1);
  }
  return count;
}

function cleanStreamedJson(raw){
  let candidate=String(raw||"").trim();
  if(candidate.startsWith("```json"))candidate=candidate.slice(7).trim();
  if(candidate.startsWith("```"))candidate=candidate.slice(3).trim();
  if(candidate.endsWith("```"))candidate=candidate.slice(0,-3).trim();
  return candidate;
}

aiAsk.addEventListener("click",async()=>{
  const prompt=aiPrompt.value.trim(); if(!prompt||activeAiController)return;
  const promptImproveMode=/^\/promp?t\s*:/i.test(prompt);
  lastAiAnswerText="";
  aiCopyAnswer.style.display="none";
  aiCopyAnswer.textContent=promptImproveMode?"Prompt kopieren":"Antwort kopieren";
  aiPrompt.value="";
  const controller=new AbortController();
  activeAiController=controller;
  aiRequestCancelled=false;
  aiAsk.disabled=true; aiCancel.style.display="inline-block"; aiThinking.style.display="flex"; aiStatus.textContent="Anfrage senden…"; updateAiGraphic();

  try{
    const response=await fetch("/api/gemini",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal:controller.signal,
      body:JSON.stringify({prompt,context:getAiContext(prompt),provider:aiProvider})
    });
    if(controller.signal.aborted||aiRequestCancelled)return;

    if(!response.ok){
      const failure=await response.json().catch(()=>({}));
      throw new Error((failure?.error||"Unbekannter Fehler")+(failure?.details?" — "+failure.details:""));
    }

    let data;
    if((response.headers.get("content-type")||"").includes("text/event-stream")){
      const reader=response.body?.getReader();
      if(!reader)throw new Error("Der KI-Stream konnte nicht gelesen werden.");
      const decoder=new TextDecoder();
      let buffer="",streamedText="",completion=null,streamFailure="";
      const processBlock=block=>{
        const lines=block.split(/\r?\n/).filter(line=>line.startsWith("data:"));
        if(!lines.length)return;
        let message;
        try{message=JSON.parse(lines.map(line=>line.slice(5).trimStart()).join("\n"));}catch{return;}
        if(message.type==="delta"){
          streamedText+=message.text||"";
          const progress=streamedJsonString(streamedText,"progress").trim();
          const actionCount=countStreamedActions(streamedText);
          let status=progress
            ? "Arbeitsplan (Zusammenfassung): "+progress
            : "Manuel KI erzeugt den konkreten Antwort- und Aktionsplan …";
          if(actionCount>0)status+="\n\nIm Stream empfangene Editor-Aktionen: "+actionCount;
          aiStatus.textContent=status;
        }else if(message.type==="complete"){
          completion=message;
        }else if(message.type==="error"){
          streamFailure=message.error||"Fehler im KI-Stream.";
        }
      };

      while(true){
        const {done,value}=await reader.read();
        buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});
        let boundary;
        while((boundary=buffer.indexOf("\n\n"))>=0){
          const block=buffer.slice(0,boundary);
          buffer=buffer.slice(boundary+2);
          processBlock(block);
        }
        if(done)break;
        if(streamFailure)break;
      }
      if(buffer.trim())processBlock(buffer);
      if(controller.signal.aborted||aiRequestCancelled)return;
      if(streamFailure)throw new Error(streamFailure);
      if(!completion)throw new Error("Der KI-Stream wurde ohne Abschluss beendet.");

      const cleaned=cleanStreamedJson(streamedText);
      let parsed=null;
      try{parsed=JSON.parse(cleaned);}catch{}
      data={
        text:typeof parsed?.answer==="string"?parsed.answer:"",
        actions:Array.isArray(parsed?.actions)?parsed.actions:[],
        progress:typeof parsed?.progress==="string"?parsed.progress:(completion.progress||""),
        provider:completion.provider||aiProvider
      };
      if(!parsed){
        data.text=streamedText;
      }
    }else{
      data=await response.json();
    }

    if(controller.signal.aborted||aiRequestCancelled)return;
    // Fallback für Anbieter, die trotz JSON-Anweisung Code-Fences oder
    // zusätzlichen Text um das JSON legen.
    if((!Array.isArray(data.actions)||!data.actions.length)&&typeof data.text==="string"){
      const candidate=cleanStreamedJson(data.text);
      const first=candidate.indexOf("{"),last=candidate.lastIndexOf("}");
      if(first>=0&&last>first){
        try{
          const recovered=JSON.parse(candidate.slice(first,last+1));
          if(Array.isArray(recovered.actions)&&recovered.actions.length){
            data.actions=recovered.actions;
            if(typeof recovered.answer==="string")data.text=recovered.answer;
            if(typeof recovered.progress==="string")data.progress=recovered.progress;
          }
        }catch{}
      }
    }
    if(controller.signal.aborted||aiRequestCancelled)return;
    lastAiAnswerText=typeof data.text==="string"?data.text.trim():"";
    aiCopyAnswer.textContent=promptImproveMode?"Prompt kopieren":"Antwort kopieren";
    aiCopyAnswer.style.display=lastAiAnswerText?"inline-block":"none";
    aiCancel.style.display="none";
    const result=await applyAiActions(data.actions);
    if(controller.signal.aborted||aiRequestCancelled)return;
    const planLine=data.progress?"Arbeitsplan: "+data.progress+"\n\n":"";
    aiStatus.textContent=promptImproveMode
      ? "Verbesserter Prompt:\n\n"+(data.text||"Manuel KI hat keinen verbesserten Prompt geliefert.")
      : planLine+(data.text||"Manuel KI hat keine Antwort geliefert.")+(result.changed?"\n\nGeändert: "+result.details.join(", ")+".":"\n\nKeine Änderung ausgeführt.");
  }catch(error){
    if(error?.name==="AbortError"||aiRequestCancelled){
      aiStatus.textContent="Anfrage abgebrochen. Du kannst direkt etwas Neues fragen.";
    }else aiStatus.textContent="Fehler: "+error.message;
  }finally{
    if(activeAiController===controller)activeAiController=null;
    aiAsk.disabled=false;aiCancel.style.display="none";aiThinking.style.display="none";
  }
});

let logicSyncReady = false;
let serverRevision = 0;
let lastLogicSnapshot = "";
let pendingLogicSnapshot = "";
let lastBlueprintSnapshot = "";

const storageInfo = document.getElementById("storageInfo");
const serverBitsLine = document.getElementById("serverBitsLine");
const clientBitsLine = document.getElementById("clientBitsLine");
const storageCompareLine = document.getElementById("storageCompareLine");
let lastServerStorageBytes = null;

function storageUtf8Bits(text){
  try{
    return new TextEncoder().encode(String(text)).byteLength * 8;
  }catch{
    return String(text).length * 8;
  }
}

function formatStorageBits(bits){
  if(!Number.isFinite(bits)) return "–";
  return Math.round(bits).toLocaleString("de-DE");
}

function getClientStorageBits(){
  try{
    const logic = JSON.parse(serializeLogicState());
    const blueprints = JSON.parse(serializeBlueprintLibrary());
    return storageUtf8Bits(JSON.stringify({...logic, blueprints}));
  }catch{
    return null;
  }
}

function updateStorageInfo(serverBytes = lastServerStorageBytes){
  if(Number.isFinite(Number(serverBytes))) lastServerStorageBytes = Number(serverBytes);

  const clientBits = getClientStorageBits();
  const serverBits = Number.isFinite(lastServerStorageBytes) ? lastServerStorageBytes * 8 : null;

  serverBitsLine.textContent = "Server Bits: " + formatStorageBits(serverBits);
  clientBitsLine.textContent = "Client Bits: " + formatStorageBits(clientBits);

  if(serverBits === null || clientBits === null){
    storageCompareLine.textContent = "Vergleich: –";
  }else if(serverBits === clientBits){
    storageCompareLine.textContent = "Vergleich: Gleich";
  }else{
    const diff = clientBits - serverBits;
    const sign = diff > 0 ? "+" : "";
    storageCompareLine.textContent = "Vergleich: Unterschied (" + sign + formatStorageBits(diff) + " Bit Client)";
  }
}

function getLogicSyncId(n){
  if(!n.__logicSyncId){
    n.__logicSyncId = "node_" + Math.random().toString(36).slice(2) + "_" + Date.now().toString(36);
  }
  return n.__logicSyncId;
}

function serializeLogicState(){
  return JSON.stringify({
    version: 3,
    nodes: nodes.map(n => {
      const d = {
        id:getLogicSyncId(n),
        x:Number(n.x)||0,
        y:Number(n.y)||0,
        type:n.type || "switch",
        chipId:n.chipId || null,
        chipPin:n.chipPin || "",
        chipShell:n.chipShell || null,
        hidden:!!n.hidden,
        chipName:n.chipName || ""
      };

      // Diese Einstellungen werden bewusst gemeinsam übertragen:
      // Key-Zuweisungen, Switch-/Output-Namen, Timerwerte und Clock-Frequenz.
      if(n.type === "key") d.assignedKey = n.assignedKey || "";
      if(n.type === "switch" || n.type === "output"){
        d.name = n.name || "";
        if(n.type === "switch") d.state = !!n.state;
      }
      if(n.type === "timer"){
        d.delay = Number(n.delay)||0;
        d.stay = !!n.stay;
      }
      if(n.type === "clock") d.interval = Number(n.interval)||1000;

      return d;
    }),
    wires: wires.map(w => ({
      from:nodes.indexOf(w.from),
      to:nodes.indexOf(w.to),
      inputIndex:Number.isFinite(w.inputIndex) ? w.inputIndex : 0
    })).filter(w => w.from >= 0 && w.to >= 0)
  });
}

function applyLogicState(state){
  if(!state || !Array.isArray(state.nodes) || !Array.isArray(state.wires)) return false;

  // Während der eigenen Mausbewegung niemals die Position oder Einstellungen zurücksetzen.
  if(drag || groupDragging || chipDrag || libraryDrag || selecting) return false;

  applyingRemoteLogicState = true;
  try{
    const oldNodes = nodes.slice();
    const oldById = new Map(oldNodes.map(n => [n.__logicSyncId, n]));
    const newNodes = [];

    for(let i=0;i<state.nodes.length;i++){
      const d = state.nodes[i];
      const type = d.type || "switch";
      let n = d.id ? oldById.get(d.id) : oldNodes[i];

      if(!n || n.type !== type){
        n = new Node(Number(d.x)||0, Number(d.y)||0, type);
      }

      n.__logicSyncId = d.id || n.__logicSyncId || getLogicSyncId(n);
      n.x = Number(d.x)||0;
      n.y = Number(d.y)||0;
      n.chipId = d.chipId || null;
      n.chipPin = d.chipPin || null;
      n.chipShell = d.chipShell || null;
      n.chipName = d.chipName || "";
      // Chip-Interngatter bleiben verborgen. Auch ältere Snapshots ohne
      // hidden-Feld lassen sich anhand von chipId ohne Pin wiederherstellen.
      n.hidden = d.hidden === true || (!!n.chipId && !n.chipPin);
      if(n.chipPin){
        n.inputs=[{x:9,y:9,value:false}];
        n.outputs=[{x:11,y:11}];
      }

      if(type === "key"){
        n.assignedKey = d.assignedKey || "";
      }
      if(type === "switch" || type === "output"){
        n.name = d.name || "";
        if(type === "switch" && Object.prototype.hasOwnProperty.call(d, "state")) n.state = !!d.state;
      }
      if(type === "timer"){
        n.delay = Number(d.delay)||0;
        n.stay = !!d.stay;
      }
      if(type === "clock"){
        n.interval = Number(d.interval)||1000;
      }

      newNodes.push(n);
    }

    nodes.length = 0;
    nodes.push(...newNodes);

    wires.length = 0;
    for(const w of state.wires){
      const from = nodes[w.from];
      const to = nodes[w.to];
      if(from && to){
        wires.push({
          from,
          to,
          inputIndex:Number.isFinite(w.inputIndex) ? w.inputIndex : 0
        });
      }
    }

    return true;
  }finally{
    applyingRemoteLogicState = false;
  }
}

function sendLogicState(){
  if(!logicSyncReady || applyingRemoteLogicState || pendingLogicSnapshot) return;
  const snapshot = serializeLogicState();
  if(snapshot === lastLogicSnapshot) return;
  lastLogicSnapshot = snapshot;

  // Nur einen unbestätigten Vollzustand gleichzeitig senden. So kann eine
  // verspätete Bestätigung keine neuere lokale Änderung überrollen.
  const payload = JSON.parse(snapshot);
  payload.baseRevision = serverRevision;
  pendingLogicSnapshot = snapshot;
  logicSocket.emit("stateChange", payload);
}

function serializeBlueprintLibrary(){
  return JSON.stringify(blueprints.map(bp => sanitizeBlueprintForStorage(bp)));
}

function applyBlueprintLibrary(list){
  if(!Array.isArray(list)) return false;
  blueprints.length = 0;
  for(const raw of list){
    try{
      const bp = expandBlueprint(cloneBlueprint(raw));
      if(bp && Array.isArray(bp.nodes)) blueprints.push(sanitizeBlueprintForStorage(bp));
    }catch{}
  }
  clampBlueprintScroll();
  return true;
}

logicSocket.on("state", state => {
  const legacyState = !state || Number(state.version || 1) < 3;
  serverRevision = Number.isInteger(state?.serverRevision) ? state.serverRevision : serverRevision;

  const hasLogicState=state&&Array.isArray(state.nodes)&&Array.isArray(state.wires);
  const localLogicChanged=logicSyncReady&&hasLogicState&&!legacyState&&serializeLogicState()!==lastLogicSnapshot;
  const unconfirmedWriteFromAnotherSource=logicSyncReady&&hasLogicState&&!legacyState&&!!pendingLogicSnapshot&&state.sourceSocketId!==logicSocket.id;
  const preserveLocalLogic=!!(localLogicChanged||unconfirmedWriteFromAnotherSource);
  if(hasLogicState){
    if(!preserveLocalLogic&&applyLogicState(state)){
      // Alte gespeicherte Zustände werden nach dem Einlesen einmal
      // in das neue Format mit Keys/Namen/Timer/Clocks umgewandelt.
      if(!legacyState) lastLogicSnapshot = serializeLogicState();
    }
    // Neuere lokale Änderungen bleiben erhalten und werden nach der
    // Antwort erneut gegen die aktuelle Serverrevision gesendet.
  }

  // Die Blueprint-Bibliothek kommt beim Start zusammen mit dem Serverstand.
  // Fehlt sie bei einem alten/noch leeren Serverstand, bleibt die lokale
  // Vorlagenbibliothek erhalten und wird anschließend hochgeladen.
  if(state && Array.isArray(state.blueprints)){
    if(applyBlueprintLibrary(state.blueprints)){
      lastBlueprintSnapshot = serializeBlueprintLibrary();
    }
  }else{
    lastBlueprintSnapshot = "";
  }

  updateStorageInfo(Number.isFinite(state?.serverStorageBytes) ? state.serverStorageBytes : lastServerStorageBytes);
  logicSyncReady = true;
  logicSocket.emit("stateApplied", serverRevision);

  if(legacyState){
    lastLogicSnapshot = "";
    sendLogicState();
  }else if(!lastLogicSnapshot){
    lastLogicSnapshot = serializeLogicState();
  }
});

logicSocket.on("stateAck", ack => {
  if(!ack) return;
  if(Number.isInteger(ack.serverRevision)) serverRevision = ack.serverRevision;
  pendingLogicSnapshot = "";
  updateStorageInfo(Number.isFinite(ack.serverStorageBytes) ? ack.serverStorageBytes : lastServerStorageBytes);
  logicSocket.emit("stateApplied", serverRevision);
});

logicSocket.on("stateRejected", info => {
  if(info && Number.isInteger(info.serverRevision)) serverRevision = info.serverRevision;
  if(pendingLogicSnapshot){
    pendingLogicSnapshot = "";
    // Erzwingt einen erneuten Schreibversuch gegen die neueste Revision.
    lastLogicSnapshot = "";
  }
});

logicSocket.on("blueprintLibrary", library => {
  if(!library || !Array.isArray(library.blueprints)) return;
  if(applyBlueprintLibrary(library.blueprints)){
    lastBlueprintSnapshot = serializeBlueprintLibrary();
  }
  if(Number.isInteger(library.serverRevision)) serverRevision = library.serverRevision;
  updateStorageInfo(Number.isFinite(library.serverStorageBytes) ? library.serverStorageBytes : lastServerStorageBytes);
  logicSocket.emit("stateApplied", serverRevision);
});

// Synchronisiert nur:
// - Blöcke, Typen und Positionen
// - Wire-Verbindungen
// - Key-Zuweisungen
// - Switch-/Output-Namen
// - Switch-AN/AUS-Zustand
// - Timerwerte
// - Clock-Frequenzen
// Laufende Zustände wie Memory-Zustände, Clock-/Timer-Laufzustände
// und gedrückte Tasten bleiben lokal. Der Switch-AN/AUS-Zustand wird bewusst synchronisiert.
setInterval(() => {
  if(!logicSyncReady || applyingRemoteLogicState || aiActionInProgress) return;

  // Während man einen Block bewegt, darf der Server die Mausbewegung
  // nicht zurücksetzen. Danach wird der aktuelle Stand übertragen.
  if(drag || groupDragging || chipDrag || libraryDrag || selecting) return;

  const snapshot = serializeLogicState();
  const logicChanged = snapshot !== lastLogicSnapshot;
  if(logicChanged&&!pendingLogicSnapshot){
    if(!historyApplying && lastLogicSnapshot) rememberHistorySnapshot(lastLogicSnapshot);
    lastLogicSnapshot = snapshot;
    const payload = JSON.parse(snapshot);
    payload.baseRevision = serverRevision;
    pendingLogicSnapshot = snapshot;
    logicSocket.emit("stateChange", payload);
  }

  const blueprintSnapshot = serializeBlueprintLibrary();
  const blueprintChanged = blueprintSnapshot !== lastBlueprintSnapshot;
  if(blueprintChanged){
    lastBlueprintSnapshot = blueprintSnapshot;
    logicSocket.emit("blueprintLibraryChange", {
      blueprints: JSON.parse(blueprintSnapshot),
      baseRevision: serverRevision
    });
  }

  if(logicChanged || blueprintChanged) updateStorageInfo();
}, 50);
/* ===== Unsichtbare Tastenkürzel: Ctrl/Cmd+Z und Ctrl/Cmd+Y ===== */
let undoStack = [];
let redoStack = [];
let historyApplying = false;

function rememberHistorySnapshot(snapshot){
  if(historyApplying || !snapshot) return;
  if(undoStack[undoStack.length-1] === snapshot) return;
  undoStack.push(snapshot);
  if(undoStack.length > 50) undoStack.shift();
  redoStack.length = 0;
}

function applyHistorySnapshot(snapshot){
  if(!snapshot) return;
  historyApplying = true;
  try{ applyLogicState(JSON.parse(snapshot)); }catch{}
  historyApplying = false;
  lastLogicSnapshot = "";
  sendLogicState();
}

function undoLogic(){
  if(!undoStack.length || drag || groupDragging || chipDrag || libraryDrag || selecting) return;
  const current = serializeLogicState();
  const previous = undoStack.pop();
  redoStack.push(current);
  applyHistorySnapshot(previous);
}

function redoLogic(){
  if(!redoStack.length || drag || groupDragging || chipDrag || libraryDrag || selecting) return;
  const current = serializeLogicState();
  const next = redoStack.pop();
  undoStack.push(current);
  if(undoStack.length > 50) undoStack.shift();
  applyHistorySnapshot(next);
}

addEventListener("keydown", event => {
  if(!(event.ctrlKey || event.metaKey) || event.altKey) return;
  const target = event.target;
  if(target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable)) return;

  if(event.key.toLowerCase() === "z"){
    event.preventDefault();
    if(event.shiftKey) redoLogic();
    else undoLogic();
  }else if(event.key.toLowerCase() === "y"){
    event.preventDefault();
    redoLogic();
  }
});


</script>
