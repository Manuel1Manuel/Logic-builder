<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logic Builder – Zugriff</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10151d;color:#fff;font-family:Arial,sans-serif}
.box{width:min(420px,calc(100% - 40px));padding:28px;border-radius:18px;background:#1b2430;box-shadow:0 18px 50px rgba(0,0,0,.35)}
h1{margin:0 0 10px}p{color:#b8c2d0}.error{margin:0 0 12px;padding:10px;border-radius:8px;background:#5b2020;color:#ffdede}.error{display:none}body.error-state .error{display:block}input{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #4b596b;background:#0f141b;color:#fff;font-size:16px;margin:10px 0 14px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#4aa3ff;color:#06111d;font-weight:700;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<form class="box" method="post" action="/login">
<h1>Logic Builder</h1>
<p>Bitte den Zugriffscode eingeben.</p>\n<p class="error" id="error">Der Zugriffscode ist nicht korrekt.</p>
<input name="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus required>
<button type="submit">Öffnen</button>\n<script>if(new URLSearchParams(location.search).get("error")==="1"){document.body.classList.add("error-state");}</script>
</form>
</body>
</html>
